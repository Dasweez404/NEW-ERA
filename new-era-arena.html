<title>New Era Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: plein écran, plateau 3D au centre, rosters sur les côtés, dock d'actions en bas. Jeu sombre volontairement mono-thème. */
:root{
  color-scheme:dark;
  --bg:#12151f; --panel:#1a1f2d; --panel2:#222839; --line:#323a52; --txt:#e8ebf4; --mut:#8e97b1;
  --amber:#ffb42e; --white:#f1f3f9; --black:#2b2e3b;
  --A:#ee5b4b; --D:#4a8cf0; --T:#3fc48a; --S:#efbf45;
  --font:'Chakra Petch',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px}
#app{position:absolute;inset:0;user-select:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#badges,#float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px #000}
.chain{color:var(--amber);font-weight:700} .zb{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;background:#0009;border-radius:99px;padding:0 6px}
.badge .tg{font-size:10px;padding:0 6px;border-radius:99px;margin-bottom:2px;color:#111;font-weight:700;animation:tgin .25s ease-out} .tg.atk{background:#ff6b6b} .tg.warn{background:#ffa02e} .tg.abl{background:#c48cff} .tg.ally{background:#3ee08a} @keyframes tgin{from{transform:scale(.4);opacity:0}}
.badge .hp{font-size:12px;letter-spacing:1px;color:#ff6b6b}
.badge .hp i{font-style:normal;color:#ffffff40}
.badge .nm{display:inline-block;padding:0 5px;border-radius:3px;background:#0009;color:#fff}
.badge.t0 .nm{border-bottom:2px solid var(--white)} .badge.t1 .nm{border-bottom:2px solid #777c93}
.badge .fx{font-size:13px} .fxi{display:inline-block;font-size:14px;filter:drop-shadow(0 0 3px #000);animation:fxbob 1s ease-in-out infinite} @keyframes fxbob{50%{transform:translateY(-2px) scale(1.15)}} .badge .nm .fxi{font-size:13px}
.flt{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:20px;text-shadow:0 2px 4px #000;animation:flt 1.3s ease-out forwards;white-space:nowrap}
@keyframes flt{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}14%{opacity:1;transform:translate(-50%,-60%) scale(1.45)}28%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes diepop{0%{transform:scale(.4) rotate(-20deg)}60%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.die.pop{animation:diepop .35s ease-out both}
@keyframes bflash{0%{transform:scale(1.14);box-shadow:0 0 0 0 #ffb42e88;border-color:var(--amber)}100%{transform:scale(1);box-shadow:0 0 0 12px #ffb42e00}}
#banner.flash{animation:bflash .5s ease-out}
@keyframes dockin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#dice{animation:dicein .22s ease-out} @keyframes dicein{from{opacity:0;transform:translate(-50%,-10px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.uc{transition:background .15s,transform .15s,opacity .3s} .uc:hover{transform:translateX(3px)} .uc.sel{transform:translateX(5px)}
#log div:last-child{animation:login .3s ease-out} @keyframes login{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.cnt{background:#0d101a;border-radius:99px;padding:0 6px;color:var(--amber);font-size:10px} .btn{transition:transform .1s,border-color .15s,background .15s} .btn:active:not(:disabled){transform:scale(.94)} .btn:hover:not(:disabled){transform:translateY(-1px)}
.pc,.mode,.tab{transition:transform .12s,border-color .15s} .pc:hover,.mode:hover{transform:translateY(-2px)} .pc.cur{transform:translateY(-2px) scale(1.02)}
.badge{transition:opacity .2s}
kbd{font-family:var(--mono);font-weight:700;font-size:11px;background:#0d101a;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--amber);white-space:nowrap}

#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 32px);pointer-events:none}
#banner{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
#banner .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
#banner .dot.t0{background:var(--white)} #banner .dot.t1{background:var(--black);border-color:#8a90aa}
#hint{background:#0c0f18cc;border-radius:6px;padding:5px 12px;color:var(--txt);text-align:center;font-size:13px}
#toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:var(--amber);color:#1b1300;font-weight:700;padding:5px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}

.roster{position:absolute;top:10px;width:212px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 300px);overflow:auto}
body.s4 .uc .st{display:none} body.s4 .uc{padding:3px 8px;min-height:0} body.s4 .uc .nm{font-size:12px} body.s4 .roster{gap:3px} body.s4 .uc .fx{display:none} .own{font-style:normal;color:var(--amber);font-size:10px;margin-left:4px}
#rosterW{left:10px} #rosterB{right:10px}
.rh{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px;color:var(--mut)}
.rh b{color:var(--txt)}
.uc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:6px;padding:5px 8px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 6px}
.uc:hover{background:var(--panel2)}
.uc.ready{box-shadow:inset 0 0 0 2px #3ee08a;background:#16281f} .uc.sel{outline:2px solid var(--amber)} .uc.played{opacity:.5} .uc.dead{opacity:.28;filter:grayscale(1)}
.uc .nm{font-weight:700} .uc .nm small{color:var(--mut);font-weight:500;margin-left:4px}
.uc .hp{color:#ff6b6b;letter-spacing:1px;text-align:right} .uc .hp i{font-style:normal;color:#ffffff35}
.uc .st{font-family:var(--mono);font-size:11px;color:var(--mut)} .uc .fx{text-align:right;font-size:12px}
.hand{font-size:12px;color:var(--mut);padding:2px 4px}
.hand b{color:var(--amber)}

#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(880px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
#info{min-width:0} #info h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--cc);color:#101010}
.stats{display:flex;gap:10px;font-family:var(--mono);font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.stats span b{color:var(--amber)}
.abil{font-size:12px;color:var(--mut);line-height:1.35} .abil b{color:var(--txt)}
#acts{display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:flex-end;max-width:420px}
.btn{font:inherit;font-size:12px;font-weight:600;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.btn:hover:not(:disabled){border-color:var(--amber)} .btn:disabled{opacity:.38;cursor:not-allowed} .btn.on{border-color:var(--amber);background:#3a2f14}
#pips{grid-column:1/-1;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pips .pip{width:10px;height:10px;border-radius:50%;background:var(--amber)} #pips .pip.off{background:#3a4058}
#cards{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#2a2110;border:1px solid var(--amber);border-radius:6px;padding:5px 9px;font-size:12px;max-width:200px}
.card.cur{outline:2px solid #fff} .card b{color:var(--amber)}

#keys{position:absolute;left:10px;bottom:10px;max-height:calc(100% - 320px);overflow:auto;background:#0c0f18d9;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;display:grid;gap:2px 8px;grid-template-columns:auto 1fr;align-items:center;max-width:250px}
#keys.min > *:not(.kh){display:none}
#keys .kh{grid-column:1/-1;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
#log{position:absolute;right:10px;bottom:10px;width:250px;max-height:190px;overflow:hidden;background:#0c0f18d9;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
#log div{opacity:.9} #log div:last-child{opacity:1;color:#fff} #log .r{color:var(--amber);font-weight:700}

#dice{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#0c0f18f0;border:1px solid var(--amber);border-radius:10px;padding:10px 16px;min-width:300px}
.drow{display:flex;align-items:center;gap:10px;padding:3px 0}
.drow .who{flex:1;font-weight:600;font-size:13px} .drow.t0 .who{color:var(--white)} .drow.t1 .who{color:#a9aec6}
.die{font-style:normal;font-family:var(--mono);font-weight:700;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;background:#eef0f7;color:#12151f;margin-left:4px}
.die.d3{background:#b7bfd8;width:24px;height:24px;font-size:12px}
.drow .sum{font-family:var(--mono);font-size:20px;min-width:34px;text-align:right}
.verdict{text-align:center;font-weight:700;margin-top:4px;color:var(--amber)}

#overlay{position:absolute;inset:0;z-index:20;background:#0a0c14;overflow:auto;padding:18px 16px;display:none}
#overlay.on{display:block}
.ov{max-width:1180px;margin:0 auto}
.ov h1{margin:0;font-size:30px;letter-spacing:.1em;text-transform:uppercase}
.ov h1 span{color:var(--amber)}
.ov p{color:var(--mut);margin:4px 0 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.dcol{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:8px;align-content:start}
.dcol.cur{border-color:var(--amber)}
.dcol h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
.dc{background:var(--panel2);border:2px solid transparent;border-top:4px solid var(--cc);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px;line-height:1.35}
.dc.sel{border-color:var(--amber);border-top-color:var(--cc)} .dc.t0{opacity:.55;box-shadow:inset 0 0 0 2px var(--white)} .dc.t1{opacity:.55;box-shadow:inset 0 0 0 2px #6b708a}
.dc h5{margin:0 0 3px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline} .dc h5 small{color:var(--mut);font-weight:500;font-size:11px}
.dc .who{font-size:11px;font-weight:700;color:var(--amber)}
.dc p{margin:3px 0 0;color:var(--mut)} .dc p b{color:var(--txt)}
.ovbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px;color:var(--mut);font-size:13px}
.big{font-size:44px;font-weight:700;margin:60px 0 10px;text-align:center}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:20px 0}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer}
.mode.sel{border-color:var(--amber)} .mode h2{margin:0 0 6px;font-size:20px;display:flex;gap:10px;align-items:center} .mode p{margin:0;color:var(--mut)}
.ov.pk{display:flex;flex-direction:column;height:100%;max-width:1200px}
.pkhead h1{font-size:22px;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:0}
.slot small{color:var(--cc);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px} .slot b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .slot.empty{color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px} .grow{flex:1}
.tab{font:inherit;font-weight:600;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:3px solid var(--cc);border-radius:6px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--panel2);border-color:var(--amber);border-bottom-color:var(--cc)}
.pgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;padding:2px}
.pc{background:var(--panel);border:2px solid transparent;border-left:4px solid var(--cc);border-radius:8px;padding:6px 9px;cursor:pointer;display:flex;flex-direction:column;position:relative;min-width:0}
.pc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pc small{color:var(--mut);font-size:11px}
.pc.cur{border-color:var(--amber);background:var(--panel2)} .pc.mine{box-shadow:inset 0 0 0 2px var(--T)} .pc.gone{opacity:.35}
.pc em{position:absolute;top:5px;right:8px;font-size:10px;font-style:normal;color:var(--amber);font-weight:700}
.sv{display:flex;gap:10px;font-family:var(--mono);font-weight:700;font-size:13px;margin-top:2px} .sv i{font-style:normal}
.pinfo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:8px;padding:8px 12px;margin-top:8px}
.bud{margin-left:14px;font-size:18px;color:var(--amber);letter-spacing:.05em} .bud.over{color:#ff6b6b} .pcs{color:var(--amber);font-size:10px;letter-spacing:0;margin-left:auto;font-weight:500} .pc.costly{opacity:.4}
.pinfo h3{margin:0 0 3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .stars{color:var(--amber);font-size:12px;letter-spacing:1px}
.fxr-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--mut);cursor:pointer;margin-bottom:4px}
#fxref{position:absolute;right:10px;bottom:210px;width:212px;max-height:calc(100% - 520px);min-height:60px;overflow:auto;background:#0c0f18d9;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.3}
#fxref.min .fxr{display:none}
.fxr{display:grid;grid-template-columns:20px 1fr;gap:0 6px;padding:2px 0;border-top:1px solid #ffffff10;color:var(--mut)} .fxr b{color:var(--txt)} .fxr i{font-style:normal;font-size:14px;grid-row:span 2}
.fxr.on{background:#3a2f14;border-radius:4px;color:#e9dcb8;box-shadow:inset 3px 0 0 var(--amber);padding-left:4px} .fxr .n{color:var(--amber);font-weight:700;float:right}
@media (max-height:700px){#fxref{display:none!important}}

.netgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.netbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.netbox h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.netbox input{font:inherit;background:#0d101a;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.netbox input:focus{outline:2px solid var(--amber);border-color:transparent}
.netlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.nrow{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:6px 8px} .nrow .nn{flex:1;display:flex;flex-direction:column;min-width:0} .nrow .nn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nrow small{color:var(--mut)}
.pl{font-size:18px;font-weight:700} .dotp{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555b73;margin:0 4px} .dotp.on{background:#3ee08a;box-shadow:0 0 6px #3ee08a}
.code{color:var(--mut);font-size:14px;letter-spacing:.1em}
.netchip{color:var(--mut);font-size:12px}
#coach{position:absolute;top:178px;left:10px;width:min(310px,calc(100% - 20px));background:#231c0ef2;border:1px solid var(--amber);border-radius:10px;padding:10px 14px;z-index:6;box-shadow:0 8px 30px #000a}
#coach .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:4px}
#coach .ct{font-size:14px;line-height:1.45} #coach .cf{margin-top:8px;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
#coach .bar{height:4px;border-radius:2px;background:#ffffff18;margin-top:6px;overflow:hidden} #coach .bar i{display:block;height:100%;background:var(--amber);transition:width .3s}

#mtoggle{position:absolute;left:calc(100% + 10px);top:0;pointer-events:auto;white-space:nowrap;font-size:11px;padding:4px 9px}
#camctl{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:6px;z-index:5}
#camctl .btn{width:42px;height:42px;justify-content:center;font-size:18px;padding:0;background:#181c29dd}
body.mobile #camctl{display:flex}
body.mobile #mtoggle{display:none}
body.mobile #keys,body.mobile #log,body.mobile .roster{display:none}
body.mobile #fxref{display:none}
body.mobile #fxref.open{display:block;position:fixed;left:8px;right:60px;bottom:auto;top:56px;width:auto;max-height:65%;z-index:25;font-size:12px}

body.mobile #acts{max-width:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;justify-content:stretch}
body.mobile .btn{min-height:40px;touch-action:manipulation}
body.mobile .mb{flex-direction:column;justify-content:center;gap:1px;padding:4px 2px;font-size:11px;position:relative;text-align:center;line-height:1.1}
body.mobile .mb .ic{font-size:17px} body.mobile .mb .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mobile .mb .cnt{position:absolute;top:2px;right:3px;font-size:9px;padding:0 4px}
body.mobile .mh{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;border-left:4px solid var(--cc);padding-left:8px} body.mobile .mh b{font-size:15px} body.mobile .mst{font-size:11px;color:var(--mut);font-family:var(--mono);flex:1;min-width:0}
body.mobile .mi{min-height:30px;padding:2px 10px}

body.mobile #coach{top:64px;left:8px;right:8px;width:auto;font-size:11px;padding:6px 10px;max-height:26vh;overflow:auto} body.mobile #coach .ct{font-size:12px;line-height:1.35} body.mobile #coach .cf{margin-top:4px}
body.mobile #dice{top:110px;min-width:0;width:calc(100% - 24px);padding:8px 10px}

body.mobile .ov h1{font-size:22px} body.mobile #overlay{padding:12px 10px}
body.mobile .modes,body.mobile .netgrid{grid-template-columns:1fr} body.mobile .mode{padding:12px} body.mobile .ovbar{gap:8px} body.mobile .ovbar span{display:none}
body.mobile .pgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))} body.mobile .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
body.mobile .pinfo{max-height:26vh;overflow:auto;font-size:12px} body.mobile .tab{padding:6px 8px;font-size:12px} body.mobile .tab kbd{display:none}
body.mobile kbd{display:none}
@media (min-width:1101px){#dock{width:min(820px,calc(100% - 600px))}}
@media (max-width:1100px){.roster{display:none}#keys{display:none}#coach{top:110px}}
@media (max-width:700px){#log{display:none}#dock{grid-template-columns:1fr}#acts{justify-content:flex-start}}

let _rs=(Date.now()^0x9e3779b9)>>>0;
const seedRng=x=>{_rs=(x>>>0)||1};
let rngN=0;
function rng(){rngN++;_rs=(_rs+0x6D2B79F5)>>>0;let t=_rs;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}

async function swapPos(a,b){const pa=a.mesh.position.clone(),pb=b.mesh.position.clone();ringFx(pa,0xb7a0ff,1.2);ringFx(pb,0xb7a0ff,1.2);
  await tween(.4,k=>{a.mesh.position.lerpVectors(pa,pb,k);b.mesh.position.lerpVectors(pb,pa,k);a.mesh.position.y+=Math.sin(k*Math.PI)*.5;b.mesh.position.y+=Math.sin(k*Math.PI)*.5});
  [a.c,b.c]=[b.c,a.c];[a.r,b.r]=[b.r,a.r];a.mesh.position.copy(cellPos(a.c,a.r));b.mesh.position.copy(cellPos(b.c,b.r));
  for(const x of[a,b])if(tokenIdx(x.c,x.r)>=0)await collectToken(x)}

   run:async(u,l)=>{for(const x of l){faceTo(u,x);if(dm)await dmg(x,dm,u);if(e&&x.alive)await addEff(x,e,u)}}}),

   run:async(u,l)=>{for(const x of l)for(const[kk,v]of parts)addBuff(x,kk,v,d,u)}}),

 repair:n=>({n,t:'ally',x:'Allié à portée (ou soi) : +1 PV, effets retirés et +1 DEF jusqu\'au prochain tour.',run:async(u,t)=>{heal(t,1);cleanse(t);addBuff(t,'def',1,'turn',u)}}),

   for(let i=0;i<k&&t.alive;i++){const r=await combat(u,t);if(r!=='hit')break;addBuff(u,'atk',1,'self',u);pop(u,`Combo ×${i+1}`,'#ffd27a')}},o),
 finisher:(n,base,o={})=>TGT(n,`Cible ${o.far?'à ≤'+o.far+' cases':'à portée'} : −${base} PV, +1 PV par capacité déjà lancée par l'équipe cette manche (chaîne, max +2).`,async(u,t)=>{const bonus=Math.min(G.chain[u.team],2);pop(t,`Chaîne ×${bonus}`,'#ffd27a');await dmg(t,base+bonus,u)},o),
 link:n=>SELF(n,'Amorce la chaîne : +2 à la chaîne d\'équipe (les coups de grâce infligent plus).',async u=>{G.chain[u.team]+=1;pop(u,'⛓ +2','#ffd27a')})

/* ===== ciblage varié : étoile, rebonds, cibles automatiques ===== */
const nearestEnemy=u=>alive(1-u.team).slice().sort((a,b)=>cheb(u,a)-cheb(u,b));
const groupBy=(u,key)=>{const m=new Map();for(const e of alive(1-u.team)){const k=e[key];(m.get(k)||m.set(k,[]).get(k)).push(e)}return[...m.values()]};
const PICK={
 nearRow:u=>{const n=nearestEnemy(u)[0];return n?alive(1-u.team).filter(e=>e.r===n.r):[]},
 nearCol:u=>{const n=nearestEnemy(u)[0];return n?alive(1-u.team).filter(e=>e.c===n.c):[]},
 denseRow:u=>{const g=groupBy(u,'r').sort((a,b)=>b.length-a.length);return g[0]||[]},
 denseCol:u=>{const g=groupBy(u,'c').sort((a,b)=>b.length-a.length);return g[0]||[]},
 weakest:u=>{const l=alive(1-u.team).slice().sort((a,b)=>a.hp-b.hp||cheb(u,a)-cheb(u,b));return l.length?[l[0]]:[]},
 strongest:u=>{const l=alive(1-u.team).slice().sort((a,b)=>stat(b,'atk')-stat(a,'atk')||cheb(u,a)-cheb(u,b));return l.length?[l[0]]:[]},
 farthest:u=>{const l=nearestEnemy(u);return l.length?[l[l.length-1]]:[]},
 grouped:u=>{const l=alive(1-u.team);return l.filter(e=>l.some(o=>o!==e&&cheb(o,e)<=1))},
 elevated:u=>alive(1-u.team).filter(e=>isStruct(e.c,e.r)),
 isolated:u=>{const l=alive(1-u.team);return l.filter(e=>!l.some(o=>o!==e&&cheb(o,e)<=2))},
 wounded:u=>alive(u.team).filter(a=>a.hp<4),
 backline:u=>alive(u.team).filter(a=>a.d.cls==='S'||a.d.cls==='T')
};
const PICKTXT={nearRow:'tous les ennemis de la rangée la plus proche',nearCol:'tous les ennemis de la colonne la plus proche',denseRow:'tous les ennemis de la rangée la plus peuplée',denseCol:'tous les ennemis de la colonne la plus peuplée',
 weakest:'l\'ennemi le plus blessé',strongest:'l\'ennemi à l\'ATK la plus haute',farthest:'l\'ennemi le plus éloigné',grouped:'les ennemis regroupés (au contact d\'un autre ennemi)',elevated:'les ennemis perchés sur une structure',isolated:'les ennemis isolés (aucun autre ennemi à ≤2 cases)',
 wounded:'tous les alliés blessés',backline:'les alliés Technique et Soutien'};
Object.assign(B,{
 star:(n,len,dm0=0,e=null,o={},dm=sane(dm0,e))=>({n,t:'none',aoe:'enemies',rad:0,x:`Étoile : ${fxList(dm,e)} à tous les ennemis alignés (${o.diag?'8':'4'} directions, ≤${len} cases).`,
   pick:u=>{const set=new Map();for(const d of(o.diag?DIRS8:DIRS))for(const ce of lineCellsDir(u,d,len)){const x=unitAt(ce.c,ce.r);if(x&&x.team!==u.team)set.set(x.id,x)}return[...set.values()]},
   run:async(u,l)=>{ringFx(u.mesh.position,ECOL(e),len*.5,.5);for(const x of l){if(dm)await dmg(x,dm,u);if(e&&x.alive)await addEff(x,e,u)}}}),
 chain:(n,k,dm0=0,e=null,o={},dm=sane(dm0,e))=>TGT(n,`Cible à portée : ${fxList(dm,e)}, puis rebondit jusqu'à ${k} fois sur l'ennemi le plus proche (≤3 cases).`,async(u,t)=>{
   let cur=t;const hit=new Set();for(let i=0;i<=k&&cur&&cur.alive;i++){hit.add(cur.id);if(dm)await dmg(cur,dm,u);if(e&&cur.alive)await addEff(cur,e,u);
     const nx=alive(1-u.team).filter(x=>!hit.has(x.id)&&cheb(x,cur)<=3).sort((a,b)=>cheb(a,cur)-cheb(b,cur))[0];if(nx)await lineFx(cur,[{c:nx.c,r:nx.r}],ECOL(e));cur=nx}},o),
 auto:(n,pk,dm0=0,e=null,dm=sane(dm0,e))=>({n,t:'none',aoe:'enemies',rad:0,x:`Cible automatiquement ${PICKTXT[pk]} : ${fxList(dm,e)}.`,pick:PICK[pk],
   run:async(u,l)=>{for(const x of l){faceTo(u,x);ringFx(x.mesh.position,ECOL(e),1.1,.4);if(dm)await dmg(x,dm,u);if(e&&x.alive)await addEff(x,e,u)}}}),
 autoBuf:(n,pk,parts,heal1=0)=>({n,t:'none',aoe:'allies',rad:0,x:`Cible automatiquement ${PICKTXT[pk]} : ${parts.map(([kk,v])=>bTxt(kk,v,'turn')).join(', ')}${heal1?`, +${heal1} PV`:''}.`,pick:PICK[pk],
   run:async(u,l)=>{for(const x of l){for(const[kk,v]of parts)addBuff(x,kk,v,'turn',u);if(heal1)heal(x,heal1)}}})
});

const PRE2=PRE1;
/* capacité à jet de dé : réussit si le dé tombe dans [lo,hi] ; bad = effet de contrecoup sur un 1 */
const DIE=(spec,lo,hi=6,o={})=>{const die=o.die||6,rg=hi>=die?`${lo}+`:`${lo}-${hi}`;
  return{...spec,x:`d${die} ${rg} : ${spec.x}`,run:async(u,tg)=>{let r=die===6?d6():d3();
    if(die===6&&G.variant&&u.flags&&u.flags.rerollAb){u.flags.rerollAb=false;r=Math.max(r,d6());log('Performer : relance conservée')}
    pop(u,`d${die} : ${r}`,'#ffb42e');log(`${u.d.name} lance un d${die} : <span class="r">${r}</span> (il faut ${rg})`);await sleep(450);
    if(r>=lo&&r<=hi)await spec.run(u,tg);
    else{pop(u,'Échec','#ff9a9a');log(`${u.d.name} rate sa capacité`);if(o.bad&&r===1)await o.bad(u,tg)}}}};
/* capacité à paliers selon le dé (1-6) : chaque palier [min,max,texte,effet] ; effet null = rien */
const R=sp=>sp.run;
const TIER=(spec,tiers)=>({...spec,x:'d6 → '+tiers.map(([lo,hi,t])=>`${lo===hi?lo:lo+'-'+hi} : ${t}`).join(' · '),
  run:async(u,tg)=>{let r=d6();if(G.variant&&u.flags&&u.flags.rerollAb){u.flags.rerollAb=false;r=Math.max(r,d6());log('Performer : relance conservée')}
    const tr=tiers.find(([lo,hi])=>r>=lo&&r<=hi);pop(u,`d6 : ${r}`,'#ffb42e');log(`${u.d.name} lance un d6 : <span class="r">${r}</span> → ${tr?tr[2]:'rien'}`);await sleep(450);
    if(tr&&tr[3])await tr[3](u,tg);else pop(u,'Rien','#aaa')}});

function buildUnit(d,team){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);const mats=[];

  const tcol=round?0xf5f7fc:0x15161d,tcol2=round?0xd9deee:0x2a2c3a,trim=round?0xffffff:0x8b5cff,mb=M(tcol),mb2=M(tcol2),mt=M(trim);

  else{add(body,new THREE.BoxGeometry(0.88,0.1,0.88),mb,0,0.05,0);const rim=add(body,new THREE.TorusGeometry(0.62,0.045,4,4),mt,0,0.1,0);rim.rotation.set(Math.PI/2,0,Math.PI/4);add(body,new THREE.BoxGeometry(0.7,0.1,0.7),mb2,0,0.14,0)}
  const rd=new THREE.Mesh((round?new THREE.RingGeometry(0.56,0.68,32):new THREE.RingGeometry(0.62,0.76,4,1).rotateZ(Math.PI/4)).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x3ee08a,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));rd.position.y=0.03;g.add(rd);g.userData.ready=rd;
  const tg=new THREE.Mesh(new THREE.RingGeometry(0.74,0.9,4,1).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xff4d4d,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));tg.position.y=0.05;g.add(tg);g.userData.tgt=tg;
  // ---- figurine (une seule matière)

  const crouch=pose.crouch||0,hipY=0.5-crouch;

  const L=joint(0.09,hipY,0),Rr=joint(-0.09,hipY,0);add(L,BX(0.15,0.5-crouch*0.4,0.16),mf,0,-(0.5-crouch*0.4)/2,0);add(Rr,BX(0.15,0.5-crouch*0.4,0.16),mf,0,-(0.5-crouch*0.4)/2,0);
  // tronc
  const T=joint(0,hipY,0);add(T,BX(0.34,0.5,0.2),mf,0,0.25,0);T.rotation.x=(pose.lean||0);T.rotation.y=(pose.ty||0)*mir;
  // tête

  add(H,BX(0.26,0.05,0.05),mf,0,0.2,0.17);add(H,BX(0.06,0.09,0.06),mf,0,0.13,0.18);      // visière + nez en relief

  else if(hs===1){for(const x of[-0.09,0,0.09])add(H,BX(0.06,0.12+Math.abs(x)*-0.5,0.06),mf,x,0.4,0)}

  // bras (pivots aux épaules)
  const Lsh=new THREE.Group();Lsh.position.set(0.25,0.42,0);T.add(Lsh);const Rsh=new THREE.Group();Rsh.position.set(-0.25,0.42,0);T.add(Rsh);

  const setArm=(sh,ang,side)=>{sh.rotation.x=ang[0];sh.rotation.z=ang[1]*side};   // side : +1 = bras gauche du modèle (x>0)
  setArm(pr,pose.ra,pr===Lsh?1:-1);setArm(pl,pose.la,pl===Lsh?1:-1);

  else if(pr_==='quiver'){add(T,BX(0.12,0.4,0.12),mf,0.1,0.28,-0.16)}
  else if(pr_==='staff'){add(fig,BX(0.06,1.5,0.06),mf,mir*0.36,0.75,0.2);add(fig,BX(0.14,0.14,0.14),mf,mir*0.36,1.55,0.2)}

const zoneUnits=(u,s,c,r)=>zoneCells(c,r,s.rad,s.shape).map(ce=>unitAt(ce.c,ce.r)).filter(x=>x&&x!==u&&(affects(u,x,s)||(s.ff&&x.team===u.team)));
const zoneValid=(u,s,c,r)=>cheb(u,{c,r})<=s.range&&(s.empty||zoneUnits(u,s,c,r).some(x=>s.ff?x.team!==u.team:true));
const deadAllies=u=>G.units.filter(x=>!x.alive&&x.team===u.team&&!x.revived);
const healTargets=u=>alive(u.team).filter(a=>(a.hp<4||a.effect)&&cheb(u,a)<=stat(u,'pre')+(isStruct(u.c,u.r)?1:0));
function bestHit(u,s){if(s.t==='line')return Math.max(0,...lineDirs(u,s).map(d=>lineUnits(u,s,d).length));
  if(s.t==='zone'){let m=0;for(const ce of targetsFor(u,s))m=Math.max(m,zoneUnits(u,s,ce.c,ce.r).length);return m}return 0}
function targetsFor(u,s){
  if(s.passive)return[];
  if(s.need&&!s.need(u))return[];
  if(s.t==='line'){const o=[];for(const d of lineDirs(u,s))o.push(...lineCellsDir(u,d,s.len,s.w));return o}
  if(s.t==='zone'){const o=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(zoneValid(u,s,c,r))o.push({c,r});return o}
  if(s.t==='multi')return targetsFor(u,{...s,t:s.aff==='allies'?'ally':'enemy'});
  if(s.t==='enemy')return alive(1-u.team).filter(t=>s.far?(cheb(u,t)<=s.far&&(!s.adj||freeAdj(t).length)&&(!s.adjSelf||freeAdj(u).length)):rangeState(u,t)===1);
  if(s.t==='ally')return alive(u.team).filter(t=>t===u||cheb(u,t)<=stat(u,'pre')+(isStruct(u.c,u.r)?1:0));
  if(s.t==='cell'){const o=[],cr=typeof s.cell==='function'?s.cell(u):s.cell;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!unitAt(c,r)&&cheb(u,{c,r})<=cr)o.push({c,r});return o}
  if(s.pick)return s.pick(u);
  const rad=typeof s.rad==='function'?s.rad(u):s.rad;
  const pool=s.aoe==='enemies'?alive(1-u.team):s.aoe==='allies'?alive(u.team):[u];return pool.filter(t=>cheb(u,t)<=rad)}

/* ============ COMBAT ============ */
const rollSet=n=>{const a=[d6()];for(let i=1;i<n;i++)a.push(d3());return a};
const rollDef=n=>{const a=[1+Math.floor(rng()*G.defDie)];for(let i=1;i<n;i++)a.push(d3());return a};
const rollDefV=n=>{const a=[1+Math.floor(Math.random()*G.defDie)];for(let i=1;i<n;i++)a.push(1+Math.floor(Math.random()*3));return a};
const rollSetV=n=>{const a=[1+Math.floor(Math.random()*6)];for(let i=1;i<n;i++)a.push(1+Math.floor(Math.random()*3));return a};
const sum=a=>a.reduce((x,y)=>x+y,0);
function paintDice(att,def,A,D,verdict,fin){
  const row=(u,arr,role)=>`<div class="drow t${u.team}"><span class="who">${role} · ${u.d.name}</span><span>${arr.map((v,i)=>`<i class="die ${i?'d3':''} ${fin?'pop':''}" style="animation-delay:${i*60}ms">${v}</i>`).join('')}</span><b class="sum">${sum(arr)}</b></div>`;
  $('#dice').innerHTML=row(att,A,'ATK')+row(def,D,'DEF · d'+G.defDie)+(verdict?`<div class="verdict">${verdict}</div>`:'')}
async function showDice(att,def,A,D,verdict){const el=$('#dice');el.hidden=false;clearTimeout(showDice.h);
  for(let i=0;i<9;i++){paintDice(att,def,rollSetV(A.length),rollDefV(D.length));await sleep(65)}
  paintDice(att,def,A,D,verdict,true);await sleep(900);showDice.h=setTimeout(()=>el.hidden=true,2200)}
async function combat(att,def){
  tutoEv('atk');
  const res=await combat0(att,def);
  const thp=passivesOf(def).find(p=>p.thorns),th=thp&&thp.thorns;
  if(th&&def.alive&&att.alive){const r=d6();pop(def,`Piques d6 : ${r}`,'#ffb42e');log(`${def.d.name} (passif ${thp.n}) : d6 = <span class="r">${r}</span>`);if(r>=th)await dmg(att,1,def)}
  return res}
async function combat0(att,def){
  camFocus([att,def],{min:.62});
  let A=rollSet(stat(att,'atk')),D=rollDef(stat(def,'def'));
  if(sub(att)==='Brawler'&&att.flags.rerollAtk){att.flags.rerollAtk=false;if(A[0]<=3){const o=A[0];A[0]=d6();log(`Brawler relance son d6 (${o} → ${A[0]})`)}}
  const sa=sum(A),sd=sum(D);
  const verdict=sa>sd?`${def.d.name} perd 1 PV`:sa<sd?'Défense réussie':(sub(att)==='Protector'||sub(def)==='Protector')?'Égalité (Protector)':'Égalité : rien';
  log(`<b>${att.d.name}</b> ${sa} vs <b>${def.d.name}</b> ${sd}`);
  await lunge(att,def);await showDice(att,def,A,D,verdict);
  if(sa>sd){await dmg(def,1,att,true);hop(att,.22,.3);
    if(att.alive){if(sub(att)==='Brawler')att.flags.rerollAtk=true;
      if(sub(att)==='Assist'){const r=d3();log(`Assist : d3 = ${r}`);if(r>=2){const al=alive(att.team).filter(a=>a.hp<4).sort((a,b)=>a.hp-b.hp)[0];if(al)heal(al,1)}}}
    return'hit'}
  if(sa<sd){hop(def,.2,.28);pop(def,'Paré !','#9cf');burst(chest(def),0x9cf0ff,8,{speed:2,up:1.5});ringFx(def.mesh.position,0x9cf0ff,1.1,.3);if(sub(def)==='Performer')def.flags.rerollAb=true;
    if(sub(def)==='Engineer'){const r=d3();log(`Engineer : d3 = ${r}`);if(r>=2)heal(def,1)}return'block'}
  if(sub(att)==='Protector')await dmg(def,1,att,true);else if(sub(def)==='Protector')await dmg(att,1,def,true);return'tie'}

/* ============ TOURS ============ */
function beginRound(){camOverview();G.round++;G.chain=[0,0];spawnEvent();netChk();setTurn((G.round-1)%G.seats);G.units.forEach(u=>u.played=false);G.sel=null;G.mode='idle';
  log(`<span class="r">— Manche ${G.round} —</span> ${G.seats===4?seatName(G.turnSeat)+' ('+TEAMS[G.turnPlayer]+') commence':TEAMS[G.turnPlayer]+' commencent'}`);focusNext();refresh()}
function focusNext(){const u=ownedLeft(G.turnSeat)[0];if(u){G.cur={c:u.c,r:u.r};if(G.phase==='play'&&ctlS(G.turnSeat))camFocus([u])}}
function selectUnit(u){camFocus([u]);netLog({k:'sel',id:u.id});tutoEv('sel',u.d.num);hop(u,.3,.32);ringFx(u.mesh.position,0xffb42e,1.1,.4);G.sel=u;G.reinSpec=null;G.reinIdx=-1;G.committed=false;G.used={move:false,atk:false,abl:false,card:false};
  G.actions=(u.effect&&u.effect.type==='stun')?1:2;G.mode=(u.effect&&u.effect.type==='frozen')?'frozen':'sel';
  if(G.actions===1)toast('Assommé : une seule action ce tour');recalc();refresh()}
function commit(){if(G.committed)return;G.committed=true;const u=G.sel;u.tempP=[];u.buffs=u.buffs.filter(b=>!(b.until==='turn'&&b.src===u.id))}
const noMoreActions=()=>G.sel&&G.mode!=='frozen'&&!['move','atk','abl','ult','card','heal'].some(c=>can(c)[0]);
async function after(){G.busy=false;if(G.phase==='over')return;
  if(G.actions<=0&&!(G.sel.freeAtk>0&&attackTargets(G.sel).length)){await sleep(300);await endTurn()}
  else{G.mode='sel';recalc();refresh();if(noMoreActions()){toast('Plus d\'action possible : fin du tour');G.busy=true;await sleep(700);await endTurn()}}}
async function autoEndIfStuck(){if(G.sel&&G.mode==='sel'&&noMoreActions()){toast('Aucune action possible : fin du tour');G.busy=true;await sleep(900);await endTurn()}}
async function endTurn(){const u=G.sel;if(!u||G.busy&&false)return;G.busy=true;
  u.played=true;u.buffs=u.buffs.filter(b=>b.until!=='self');u.freeAtk=0;
  if(u.effect&&['stun','numb','disrupt','jam','frozen'].includes(u.effect.type))u.effect=null;
  G.sel=null;G.mode='idle';G.hl=new Map();
  let nx=-1;for(let i=1;i<=G.seats;i++){const sd=(G.turnSeat+i)%G.seats;if(ownedLeft(sd).length){nx=sd;break}}
  if(nx>=0)setTurn(nx);else await endRound();
  if(G.phase==='over'){G.busy=false;return}
  focusNext();G.busy=false;recalc();refresh()}
async function endRound(){
  for(const u of[...G.units]){if(!u.alive||!u.timers.length)continue;
    for(const tm of[...u.timers]){tm.left--;
      if(tm.left<=0){u.timers.splice(u.timers.indexOf(tm),1);
        if(tm.kind==='bomb'){log(`💥 La bombe « ${tm.name} » explose sur ${u.d.name}`);burst(chest(u),0xffa02e,30,{speed:4,up:4,size:.18,life:.9});ringFx(u.mesh.position,0xffa02e,2.4,.6);shakeCam(.6);hitStop(.1);
          await dmg(u,tm.dmg,tm.src);for(const x of alive(0).concat(alive(1)))if(x!==u&&x.alive&&cheb(x,u)<=1)await dmg(x,1,tm.src)}
        else if(tm.kind==='hot'){heal(u,tm.amt)}}
      else if(tm.kind==='hot'){log(`${tm.name} soigne ${u.d.name}`);heal(u,tm.amt)}
      if(G.phase==='over')return}}
  for(const z of[...G.zones]){for(const u of alive(0).concat(alive(1)))if(z.keys.has(KEY(u.c,u.r)))await applyZone(z,u);z.ttl--;z.hit.clear();if(z.ttl<=0){G.zones.splice(G.zones.indexOf(z),1);log(`La zone ${ZK[z.kind].n} se dissipe`)}
    if(G.phase==='over')return}
  syncZones();
  for(const u of[...G.units]){if(!u.alive||!u.effect)continue;
    if(u.effect.type==='toxic'){log(`${u.d.name} souffre du poison`);const l=--u.effect.left;await dmg(u,1,null);if(u.alive&&l<=0)u.effect=null}
    else if(u.effect.type==='burn'){const r=d6();log(`Brûlure de ${u.d.name} : d6 = ${r}`);if(r<=3){u.effect=null;pop(u,'Éteint','#9cf')}else await dmg(u,1,null)}
    if(G.phase==='over')return}
  for(const u of G.units)if(u.alive&&sub(u)==='Assist'){const w=alive(u.team).filter(a=>a.hp<4&&cheb(a,u)<=2).sort((a,b)=>a.hp-b.hp)[0];if(w){const r=d6();log(`${u.d.name} (Assist) : présence apaisante, d6 = <span class="r">${r}</span>`);if(r>=4)heal(w,1)}}
  for(const u of G.units)if(u.alive){const rp=passivesOf(u).find(p=>p.regen);if(rp&&u.hp<4){log(`${u.d.name} : passif ${rp.n}`);heal(u,rp.regen)}}
  G.units.forEach(u=>u.buffs=u.buffs.filter(b=>b.until!=='round'));
  await sleep(250);beginRound()}

/* actions du joueur */
function attackTargets(u){const o=[];for(const t of alive(1-u.team)){const s=rangeState(u,t);if(s)o.push({t,solo:s===2})}return o}
function can(cmd){const u=G.sel;if(!u)return[false,'Aucun personnage'];if(G.mode==='frozen')return[false,'Gelé'];const eff=u.effect&&u.effect.type;
  switch(cmd){
   case'move':if(G.used.move)return[false,'Déjà déplacé'];if(G.actions<=0)return[false,'Plus d\'actions'];if(eff==='numb')return[false,'Engourdi'];if(reachable(u).size<2)return[false,'Aucune case'];return[true];
   case'atk':if(u.freeAtk>0)return attackTargets(u).length?[true]:[false,'Personne à portée'];if(G.used.atk)return[false,'Déjà attaqué'];if(G.actions<=0)return[false,'Plus d\'actions'];
     return attackTargets(u).length?[true]:[false,'Personne à portée'];
   case'abl':case'ult':{const s=cmd==='abl'?u.d.ab:u.d.ul;if(s.passive)return[false,'Passif : toujours actif'];if(G.used.abl)return[false,'Capacité déjà utilisée'];if(G.actions<=0)return[false,'Plus d\'actions'];if(eff==='disrupt')return[false,'Bouleversement'];
     if(cmd==='ult'){if(G.round<2)return[false,'Dès la manche 2'];if(G.ult[u.owner])return[false,'Ultime déjà utilisé']}
     return targetsFor(u,s).length?[true]:[false,'Aucune cible']}
   case'heal':{if(u.d.cls!=='S')return[false,'Réservé au Soutien'];if(G.used.heal)return[false,'Déjà soigné ce tour'];if(G.actions<=0)return[false,'Plus d\'actions'];return healTargets(u).length?[true]:[false,'Aucun allié blessé à portée']}
   case'card':if(G.used.card)return[false,'1 renfort par tour'];if(!G.hand[u.team].length)return[false,'Aucun renfort'];if(eff==='jam')return[false,'Brouillage'];return[true]}}
async function doMove(dest){netLog({k:'move',c:dest.c,r:dest.r});tutoEv('move');const u=G.sel,reach=reachable(u);G.busy=true;commit();const p=pathTo(u,reach,dest);G.hl=new Map();paintHL();
  await walk(u,p);G.used.move=true;G.actions--;log(`${u.d.name} → ${cellName(u.c,u.r)}`);
  if(tokenIdx(u.c,u.r)>=0)await collectToken(u);await zoneTouch(u);await after()}
async function doAttack(t,solo){netLog({k:'atk',t:t.id,solo:!!solo});const u=G.sel;G.busy=true;commit();G.hl=new Map();paintHL();
  if(u.freeAtk>0)u.freeAtk--;else{G.actions--;G.used.atk=true}
  if(solo)G.actions=0;await combat(u,t);await after()}
async function doAbility(isUlt,tg){const u=G.sel,rein=!isUlt&&!!G.reinSpec,ri=G.reinIdx,s=isUlt?u.d.ul:abSpec(u);camFocus(tgPoints(u,tg),{min:.6});if(isUlt)camPunch(1800,.95,.9);netLog({k:'abl',u:!!isUlt,t:serTarget(s,tg),rc:rein?ri:undefined});tutoEv(isUlt?'ult':rein?'rein':'abl');G.busy=true;commit();G.hl=new Map();paintHL();
  if(rein){const c=G.hand[u.team].splice(ri,1)[0];G.disc[u.team].push(c.ch);G.used.card=true;log(`<b>${u.d.name}</b> appelle <b>${c.ch.name}</b> en renfort : <span class="r">${s.n}</span>`);pop(u,'Renfort · '+c.ch.name,'#d9b8ff');ringFx(u.mesh.position,0xd9b8ff,1.5,.5)}
  else{G.actions--;G.used.abl=true;if(isUlt)G.ult[u.owner]=true;log(`<b>${u.d.name}</b> utilise ${isUlt?'l\'ultime ':''}<span class="r">${s.n}</span>`);pop(u,s.n,'#d9b8ff')}
  G.reinSpec=null;G.reinIdx=-1;
  await s.run(u,tg);G.chain[u.team]++;await sleep(200);if(G.phase==='over')return;await after()}
async function doHeal(t){netLog({k:'heal',t:t.id});tutoEv('heal');const u=G.sel;G.busy=true;commit();G.hl=new Map();G.pv={hl:new Map(),mark:new Map()};paintHL();G.actions--;G.used.heal=true;
  log(`<b>${u.d.name}</b> soigne <b>${t.d.name}</b>`);faceTo(u,t);await hop(u,.18,.25);
  const r=d6();pop(u,`d6 : ${r}`,'#ffb42e');log(`${u.d.name} lance un d6 : <span class="r">${r}</span> → ${r>=4?'soin réussi':'rien'}`);await sleep(350);
  if(r>=4){heal(t,1);if(u.d.sub==='Engineer'){addBuff(t,'def',1,'turn',u);pop(t,'+1 DEF','#6aa8ff')}else cleanse(t)}else pop(t,'Raté','#aaa');
  await sleep(250);await after()}
async function useCard(i){const u=G.sel,c=G.hand[u.team][i];if(!c)return;const sp=c.ch.ab;
  if(sp.passive){netLog({k:'card',i});tutoEv('rein');G.busy=true;commit();G.hand[u.team].splice(i,1);G.disc[u.team].push(c.ch);G.used.card=true;(u.tempP=u.tempP||[]).push(sp);
    log(`<b>${u.d.name}</b> appelle <b>${c.ch.name}</b> en renfort : passif <span class="r">${sp.n}</span> jusqu'à son prochain tour`);pop(u,'Passif · '+sp.n,'#d9b8ff');ringFx(u.mesh.position,0xd9b8ff,1.4,.5);burst(chest(u),0xd9b8ff,12,{speed:1.2,up:2.4,g:-1});
    await sleep(300);G.mode='sel';recalc();await after();return}
  if(!targetsFor(u,sp).length){toast(`Aucune cible pour ${sp.n}`);return}
  G.reinSpec=sp;G.reinIdx=i;G.multi=[];G.mode='abl';recalc();const k=[...G.hl.keys()][0];if(k){const[cc,rr]=k.split(',').map(Number);G.cur={c:cc,r:rr}}refresh()}
/* ============ SURBRILLANCES ============ */
const TMC={atk:0xff4d4d,hint:0xff4d4d,abl:0xc48cff,ally:0x3ee08a,warn:0xffa02e};
function areaCells(u,f){const out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c===u.c&&r===u.r)continue;const cell={c,r};let ok=false;
  if(f==='atk')ok=rangeState(u,cell)===1;
  else if(f.t==='enemy')ok=f.far?cheb(u,cell)<=f.far:rangeState(u,cell)===1;
  else if(f.t==='ally')ok=cheb(u,cell)<=stat(u,'pre')+(isStruct(u.c,u.r)?1:0);
  else if(f.t==='none'){const rad=typeof f.rad==='function'?f.rad(u):f.rad;ok=rad<99&&cheb(u,cell)<=rad}
  if(ok)out.push(KEY(c,r))}return out}
function recalc(){G.hl=new Map();G.solo=new Set();G.tmark=new Map();G.tcount=null;
  if(G.phase==='place'){spawnOf(G.pl%G.seats).forEach(([c,r])=>{if(!unitAt(c,r))G.hl.set(KEY(c,r),'place')});paintHL();return}
  const u=G.sel;if(!u||G.phase!=='play'){paintHL();return}
  const area=(f,t)=>{for(const k of areaCells(u,f))if(!G.hl.has(k))G.hl.set(k,t)};
  if(G.mode==='sel'&&can('atk')[0])for(const{t} of attackTargets(u))G.tmark.set(t.id,'hint');
  if(G.mode==='move'){for(const[k] of reachable(u))if(k!==KEY(u.c,u.r))G.hl.set(k,'move')}
  else if(G.mode==='atk'){const ts=attackTargets(u);G.tcount=ts.length;
    for(const{t,solo} of ts){G.hl.set(KEY(t.c,t.r),'atk');G.tmark.set(t.id,'atk');if(solo)G.solo.add(KEY(t.c,t.r))}area('atk','rngA')}
  else if(G.mode==='heal'){const ts=healTargets(u);G.tcount=ts.length;for(const t of ts){G.hl.set(KEY(t.c,t.r),'ally');G.tmark.set(t.id,'ally')}
    for(const c of areaCells(u,{t:'ally'}))if(!G.hl.has(c))G.hl.set(c,'rngB')}
  else if((G.mode==='abl'||G.mode==='ult')&&['line','zone'].includes((G.mode==='abl'?abSpec(u):u.d.ul).t)){
    const s=G.mode==='abl'?abSpec(u):u.d.ul,ts=targetsFor(u,s);G.tcount=s.t==='line'?lineDirs(u,s).length:bestHit(u,s);
    if(s.t==='line'){for(const d of lineDirs(u,s)){for(const ce of lineCellsDir(u,d,s.len,s.w)){const k=KEY(ce.c,ce.r);if(!G.hl.has(k))G.hl.set(k,'rngB');const x=unitAt(ce.c,ce.r);if(x&&x!==u&&affects(u,x,s))G.tmark.set(x.id,s.aff==='allies'?'ally':'abl')}}}
    else for(const ce of ts)G.hl.set(KEY(ce.c,ce.r),'rngB')}
  else if(G.mode==='abl'||G.mode==='ult'){const s=G.mode==='abl'?abSpec(u):u.d.ul,ts=targetsFor(u,s);G.tcount=ts.length;
    const kind=s.t==='ally'||(s.t==='none'&&s.aoe!=='enemies')?'ally':'abl';
    for(const t of ts){if(s.t==='cell'){G.hl.set(KEY(t.c,t.r),'abl')}else{G.hl.set(KEY(t.c,t.r),kind);G.tmark.set(t.id,kind)}}
    for(const x of G.multi)G.tmark.set(x.id,'atk');
    area(s.t==='multi'?{t:s.aff==='allies'?'ally':'enemy'}:s,'rngB')}
  refreshPreview();paintHL()}
function refreshPreview(){G.pv={hl:new Map(),mark:new Map()};const u=G.sel;if(!u||G.phase!=='play')return;
  const s=G.mode==='abl'?abSpec(u):G.mode==='ult'?u.d.ul:null;if(!s)return;const{c,r}=G.cur;
  if(s.t==='line'){const d=dirFromCell(u,s,c,r);if(d&&lineUnits(u,s,d).length){for(const ce of lineCellsDir(u,d,s.len,s.w))G.pv.hl.set(KEY(ce.c,ce.r),'abl');for(const x of lineUnits(u,s,d))G.pv.mark.set(x.id,s.aff==='allies'?'ally':x.team===u.team?'warn':'abl')}}
  else if(s.t==='zone'&&zoneValid(u,s,c,r)){for(const ce of zoneCells(c,r,s.rad,s.shape))G.pv.hl.set(KEY(ce.c,ce.r),s.hazard?'atk':'abl');for(const x of zoneUnits(u,s,c,r))G.pv.mark.set(x.id,x.team===u.team?(s.aff==='allies'?'ally':'warn'):'abl')}}

async function botAct(u){
  if(can('card')[0]&&Math.random()<.3){const idx=Math.floor(Math.random()*G.hand[1].length),sp=G.hand[1][idx].ch.ab;

  if(can('heal')[0]&&Math.random()<.7){const w=healTargets(u).sort((a,b)=>a.hp-b.hp)[0];await doHeal(w);return true}
  if(can('atk')[0]&&Math.random()<.75){const ts=attackTargets(u),x=Math.random()<.4?ts.slice().sort((a,b)=>a.t.hp-b.t.hp)[0]:pickR(ts);await doAttack(x.t,x.solo);return true}

  else if(s.t==='multi')tg=shuffle(ts.slice()).slice(0,s.k);
  else tg=ts;
  await doAbility(isUlt,tg);return true}

function tutoFocus(){const T=G.tuto;if(!T||T.done)return null;const st=TUTO[T.i];if(!st||!st.focus)return null;const f=st.focus();if(!f)return null;return f.mesh?(f.alive?f.mesh.position:null):cellPos(f.c,f.r)}
function renderCoach(){const el=$('#coach');if(!el)return;const T=G.tuto;
  if(!T||T.done||G.phase==='over'){el.hidden=true;return}
  const st=TUTO[T.i],n=TUTO.length;el.hidden=false;
  el.innerHTML=`<div class="ch"><span>Tutoriel · étape ${T.i+1}/${n}</span><button class="btn" id="cSkip" style="font-size:11px;padding:2px 8px">Passer le tutoriel</button></div><div class="ct">${st.t}</div>
   <div class="cf">${st.info?`<button class="btn on" id="cNext"><kbd>N</kbd> Suivant</button>`:'<span>Fais l\'action demandée pour continuer.</span>'}</div><div class="bar"><i style="width:${Math.round(T.i/n*100)}%"></i></div>`;
  $('#cSkip').onclick=()=>startMenu();const nx=$('#cNext');if(nx)nx.onclick=tutoNext}



/* ============ SUIVI DE CAMÉRA ============ */
G.camFollow=(lsGet('ne_follow')!=='0');
const clampF=(v,a,b)=>Math.max(a,Math.min(b,v));
function ptOf(p){if(!p)return null;if(p.isVector3)return p;if(p.mesh)return p.mesh.position;if(p.c!==undefined)return cellPos(p.c,p.r);return null}
/* cadre les points d'intérêt (persos qui jouent, cibles) : centre + zoom selon l'écart */
function camFocus(pts,o={}){if(!G.camFollow||G.fast||inMenus())return;const P=pts.map(ptOf).filter(Boolean);if(!P.length)return;
  let mx=0,mz=0;for(const q of P){mx+=q.x;mz+=q.z}mx/=P.length;mz/=P.length;
  let span=0;for(const a of P)for(const b of P)span=Math.max(span,Math.hypot(a.x-b.x,a.z-b.z));
  CAMT.px=clampF(mx,-PB,PB);CAMT.pz=clampF(mz+(G.mobile?1.6:0.7),-PB,PB);
  CAMT.zoom=clampF(o.zoom!=null?o.zoom:(o.min||0.84)+span*0.045,o.min||0.5,1)}
function camOverview(){Object.assign(CAMT,{px:CAMHOME.px,pz:CAMHOME.pz,zoom:CAMHOME.zoom})}
/* coup de projecteur : recul d'angle + zoom un instant, puis retour */
let punchT=0;
function camPunch(dur=1400,pitch=0.98,zoomK=0.86){if(!G.camFollow||G.fast)return;const p0=CAMT.pitch,z0=CAMT.zoom;CAMT.pitch=Math.min(p0,pitch);CAMT.zoom=Math.max(.5,z0*zoomK);const id=++punchT;
  setTimeout(()=>{if(id===punchT){CAMT.pitch=p0;CAMT.zoom=z0}},dur)}
function setFollow(on){G.camFollow=on;lsSet('ne_follow',on?'1':'0');toast(on?'Caméra automatique : activée':'Caméra automatique : désactivée');if(!on)camOverview();renderCamCtl()}
function tgPoints(u,tg){const o=[u];if(!tg)return o;if(Array.isArray(tg)){for(const x of tg){if(x&&x.d)o.push(x);else if(x&&x.c!==undefined)o.push(x)}}
  else if(tg.units){o.push(...tg.units);if(tg.c!==undefined)o.push({c:tg.c,r:tg.r})}else if(tg.d)o.push(tg);else if(tg.c!==undefined)o.push({c:tg.c,r:tg.r});return o}

/* ============ MODE MOBILE ============ */
function initMobile(){const v=lsGet('ne_mobile');G.mobile=v!==null?v==='1':(matchMedia('(pointer:coarse)').matches||innerWidth<760);applyMobile()}
function applyMobile(){document.body.classList.toggle('mobile',G.mobile);const t=$('#mtoggle');if(t)t.textContent=G.mobile?'🖥 Mode PC':'📱 Mode mobile';renderCamCtl();resize()}
function setMobile(on){G.mobile=on;lsSet('ne_mobile',on?'1':'0');applyMobile();if(G.phase==='menu')showMenu();else if(G.phase==='pick')showPick();refresh()}
function renderCamCtl(){const el=$('#camctl');if(!el)return;el.innerHTML=G.mobile?`<button class="btn" data-k="l">⟲</button><button class="btn" data-k="r">⟳</button><button class="btn" data-k="p">＋</button><button class="btn" data-k="m">－</button><button class="btn" data-k="v">◢</button><button class="btn" data-k="0">⌂</button><button class="btn" data-k="fx">ℹ</button><button class="btn" data-k="fo" style="${G.camFollow?'border-color:var(--amber)':''}">🎥</button><button class="btn" data-k="pc">🖥</button>`:'';
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==='l')CAMT.yaw-=Math.PI/4;else if(k==='r')CAMT.yaw+=Math.PI/4;else if(k==='p')CAMT.zoom=Math.max(.45,CAMT.zoom/1.2);else if(k==='m')CAMT.zoom=Math.min(1.8,CAMT.zoom*1.2);
    else if(k==='v')CAMT.pitch=CAMT.pitch>1.3?CAMHOME.pitch:1.5;else if(k==='0')Object.assign(CAMT,CAMHOME);else if(k==='fx')$('#fxref').classList.toggle('open');else if(k==='fo')setFollow(!G.camFollow);else if(k==='pc')setMobile(false)})}
const mobHint=()=>{const m=G.mode,u=G.sel;
  if(G.online&&G.turnSeat!==G.mySeat)return G.seats===4?'Tour de '+seatName(G.turnSeat)+'…':'Tour de l\'adversaire…';if(G.bot&&G.turnPlayer===1)return'Le bot réfléchit…';
  if(m==='idle')return'Touche un pion à l\'anneau vert (ou ⏭ Suivant)';
  if(m==='frozen')return`${u.d.name} est gelé 🧊 : brise la glace (−1 PV) ou passe`;
  if(m==='sel')return`Actions restantes : ${G.actions} · choisis une action ci-dessous`;
  if(m==='move')return'Touche une case bleue pour te déplacer';
  if(m==='atk')return`${G.tcount} ennemi(s) attaquable(s) : touches-en un (rouge)`;
  if(m==='heal')return`${G.tcount} allié(s) à soigner : touches-en un (vert)`;
  if(m==='card')return'Touche une carte renfort pour la jouer';
  if(m==='abl'||m==='ult'){const s=m==='abl'?abSpec(u):u.d.ul;
    return s.t==='none'?`${s.n} : appuie sur ✔ Valider`:s.t==='line'?`${s.n} : touche une case alignée pour viser, touche-la à nouveau pour lancer`:s.t==='zone'?`${s.n} : touche le centre pour viser, touche-le à nouveau pour lancer`:s.t==='multi'?`${s.n} : touche jusqu'à ${s.k} cibles (${G.multi.length}/${s.k}), puis ✔ Valider`:`${s.n} : touche une cible en surbrillance`}
  return''};
function renderDockMobile(insp){
  const info=$('#info'),acts=$('#acts'),pips=$('#pips'),cards=$('#cards'),u=insp;pips.innerHTML='';cards.innerHTML='';
  if(!u){info.innerHTML=`<div class="abil">${G.phase==='place'?'Touche une case jaune pour placer ton pion.':'Touche un pion pour voir ses stats.'}</div>`;acts.innerHTML=G.phase==='play'?`<button class="btn mb" data-m="next"><span class="ic">⏭</span><span>Suivant</span></button>`:'';
    acts.querySelectorAll('[data-m]').forEach(b=>b.onclick=nextUnit);return}
  const d=u.d;
  info.innerHTML=`<div class="mh" style="--cc:${CLS[d.cls].c}"><b>${d.name}</b>${u.effect?`<span class="fxi">${fxIcon(u)}</span>`:''}<span class="chip">${d.sub}</span><span class="mst">${hearts(u)} · ATK ${stat(u,'atk')} DEF ${stat(u,'def')} HAB ${stat(u,'hab')} PRE ${stat(u,'pre')}</span><button class="btn mi" id="mInfo">${G.mInfo?'▾':'ℹ'}</button></div>`
   +(G.mInfo?`<div class="abil">${d.power?`<b>Pouvoir · ${d.power}</b><br>`:''}<b>${d.ab.passive?'Passif · ':''}${d.ab.n}</b> — ${d.ab.x}<br><b>Ultime · ${d.ul.n}</b> — ${d.ul.x}</div>`:'');
  $('#mInfo').onclick=()=>{G.mInfo=!G.mInfo;renderDock()};
  if(G.sel!==u||G.phase!=='play'||locked()){acts.innerHTML=(G.phase==='play'&&!locked()&&!G.sel)?`<button class="btn mb" data-m="next"><span class="ic">⏭</span><span>Suivant</span></button>`:'';acts.querySelectorAll('[data-m]').forEach(b=>b.onclick=nextUnit);return}
  const cnt=cmd=>cmd==='atk'?attackTargets(u).length:cmd==='abl'?(d.ab.t==='line'||d.ab.t==='zone'?bestHit(u,d.ab):targetsFor(u,d.ab).length):cmd==='ult'?(d.ul.t==='line'||d.ul.t==='zone'?bestHit(u,d.ul):targetsFor(u,d.ul).length):cmd==='heal'?healTargets(u).length:0;
  const B=(ic,label,cmd,on)=>{const[ok,why]=can(cmd);const n=ok?cnt(cmd):0;return`<button class="btn mb ${on?'on':''}" data-cmd="${cmd}" ${ok?'':'disabled'} title="${why||''}"><span class="ic">${ic}</span><span class="lb">${label}</span>${n?`<small class="cnt">${n}</small>`:''}</button>`};
  const aiming=['move','atk','abl','ult','heal','card'].includes(G.mode);
  let h='';
  if(G.mode==='frozen')h=`<button class="btn mb" data-cmd="thaw"><span class="ic">🔨</span><span>Briser (−1 PV)</span></button><button class="btn mb" data-cmd="end"><span class="ic">⏹</span><span>Passer</span></button>`;
  else{
    if(aiming&&G.mode!=='card'){const s=G.mode==='abl'?abSpec(u):G.mode==='ult'?d.ul:null,needOk=s&&(s.t==='none'||s.t==='multi'||s.t==='line'||s.t==='zone');
      h+=`${needOk?`<button class="btn mb on" data-m="ok"><span class="ic">✔</span><span>Valider</span></button>`:''}<button class="btn mb" data-m="cancel"><span class="ic">✖</span><span>Annuler</span></button>`}
    else if(G.mode==='card')h+=`<button class="btn mb" data-m="cancel"><span class="ic">✖</span><span>Annuler</span></button>`;
    h+=B('➜','Déplacer','move',G.mode==='move')+B('⚔','Attaquer','atk',G.mode==='atk')+B('✦',(d.ab.passive?'Passif · ':'')+d.ab.n,'abl',G.mode==='abl')+B('★','Ultime','ult',G.mode==='ult')+B('🎴',`Renfort ${G.hand[u.team].length}`,'card',G.mode==='card')+(d.cls==='S'?B('✚','Soigner','heal',G.mode==='heal'):'')
      +`<button class="btn mb" data-m="next"><span class="ic">⏭</span><span>Suivant</span></button><button class="btn mb" data-cmd="end"><span class="ic">⏹</span><span>Fin</span></button>`}
  acts.innerHTML=h;
  acts.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd));
  acts.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(k==='next')nextUnit();else if(k==='cancel')cancel();else if(k==='ok'){
    if(G.mode==='abl'||G.mode==='ult'){const s=G.mode==='abl'?abSpec(u):d.ul;if(s.t==='none')doAbility(G.mode==='ult',targetsFor(u,s));else if(s.t==='multi'&&G.multi.length){const l=G.multi.slice();G.multi=[];doAbility(G.mode==='ult',l)}else confirmAct()}}});
  if(G.mode==='card'){const hand=G.hand[u.team];cards.innerHTML=hand.map((c,i)=>`<button class="card mcard" data-i="${i}"><b>${c.n}</b><br>${c.x}</button>`).join('');cards.querySelectorAll('button').forEach(b=>b.onclick=()=>useCard(+b.dataset.i))}
  pips.innerHTML=`Actions : ${[0,1].map(i=>`<span class="pip ${i<G.actions?'':'off'}"></span>`).join('')}${u.freeAtk>0?` · Blitz ×${u.freeAtk}`:''}`}

/* ============ BOUCLE ============ */
let last=performance.now();
function frame(now){const raw=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  let dt=raw;if(stopT>0){stopT-=raw;dt=raw*.05}
  stepTweens(dt);stepParts(dt);updateCam(raw);
  const cp=cellPos(G.cur.c,G.cur.r,0.05+Math.sin(t*5)*.03);cursor.position.lerp(cp,1-Math.exp(-raw*22));cursor.scale.setScalar(1+Math.sin(t*6)*.04);
  cursor.visible=!inMenus()&&G.phase!=='over';cursor.material.color.setHex(G.busy?0x777777:0xffb42e);
  if(G.sel&&G.sel.alive){selRing.visible=true;selRing.position.copy(G.sel.mesh.position);selRing.position.y+=0.16;selRing.rotation.y=t;selRing.scale.setScalar(1+Math.sin(t*5)*.08)}else selRing.visible=false;
  for(const m of zoneGroup.children){m.material.opacity=.3+.15*Math.sin(t*4+m.position.x*2+m.position.z);if(Math.random()<raw*1.2){const z=m.userData.z;burst(m.position.clone(),ZK[z.kind].col,1,{speed:.3,up:1.6,g:-1,size:.08,life:.8})}}
  {const fp=tutoFocus();tutoRing.visible=!!fp;if(fp){tutoRing.position.set(fp.x,(fp.y||0)+0.08,fp.z);tutoRing.scale.setScalar(1.15+Math.sin(t*6)*.18)}}
  for(const g of tokenMs)if(g.visible){const{tk,tkr}=g.userData;tk.rotation.y=t*2;tk.position.y=0.55+Math.sin(t*3)*.09;tk.scale.setScalar(1+Math.sin(t*5)*.08);tkr.rotation.z=t;tkr.scale.setScalar(1+Math.sin(t*3)*.12)}
  for(const u of G.units){if(!u.alive)continue;const b=u.mesh.userData.body,sel=G.sel===u;
    u.squash*=Math.exp(-raw*11);if(Math.abs(u.squash)<.002)u.squash=0;
    const br=Math.sin(t*2.2+u.id)*.025,sq=u.squash+br;b.scale.set(1+sq*.55,1-sq,1+sq*.55);
    if(sel&&!G.busy)b.position.y=Math.abs(Math.sin(t*4))*.07;else if(!tweens.length)b.position.y*=Math.exp(-raw*10);
    if(!sel&&!tweens.length)b.position.x*=Math.exp(-raw*10);
    {const P=u.mesh.userData.parts,B0=u.mesh.userData.base;if(P){u.walkA+=((u.walking?1:0)-u.walkA)*(1-Math.exp(-raw*10));u.atkA*=Math.exp(-raw*6);
      const sw=Math.sin(t*16)*.8*u.walkA,idle=Math.sin(t*1.7+u.id)*.03;
      P.ll.rotation.x=B0.ll+sw;P.rl.rotation.x=B0.rl-sw;P.la.rotation.x=B0.la-sw*.5+idle;P.ra.rotation.x=B0.ra+sw*.5-1.5*u.atkA+idle;P.head.rotation.y=B0.hy+Math.sin(t*.9+u.id)*.08}}
    let da=u.faceY-u.mesh.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));u.mesh.rotation.y+=da*(1-Math.exp(-raw*14));
    const rdy=G.phase==='play'&&u.owner===G.turnSeat&&!u.played&&!sel&&ctlS(u.owner);
    const tm=G.pv.mark.get(u.id)||(G.tmark&&G.tmark.get(u.id)),tr=u.mesh.userData.tgt;if(tm)tr.material.color.setHex(TMC[tm]);
    tr.material.opacity+=(((tm?(tm==='hint'?.5:.95)*(.75+.25*Math.sin(t*7)):0))-tr.material.opacity)*(1-Math.exp(-raw*14));tr.rotation.y=t*1.4;tr.scale.setScalar(tm&&tm!=='hint'?1+Math.sin(t*7)*.07:1);
    const rm=u.mesh.userData.ready;rm.material.opacity+=((rdy?.55+.35*Math.sin(t*5):0)-rm.material.opacity)*(1-Math.exp(-raw*12));rm.scale.setScalar(1+(rdy?Math.sin(t*5)*.06:0));
    u.flash*=Math.exp(-raw*9);const dim=u.played?.45:1;
    for(const m of u.mesh.userData.mats){m.color.copy(m.userData.col).multiplyScalar(dim);m.emissive.setScalar(u.flash*.85)}}
  if(G.phase==='play'&&G.bot&&G.turnPlayer===1&&G.mode==='idle'&&!G.busy&&!G.botRun)botTurn();
  paintHL();renderer.render(scene,cam);renderBadges();requestAnimationFrame(frame)}

{const v=parseInt(lsGet('ne_def'));if(DEFS.includes(v))G.defDie=v;const b=parseInt(lsGet('ne_board'));if(b>=0&&b<BOARDS.length)G.board=b;if(lsGet('ne_events')==='0')G.events=false}
initMobile();$('#mtoggle').onclick=()=>setMobile(!G.mobile);renderKeys();startMenu();requestAnimationFrame(frame);
</script>
