<title>New Era Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: plein écran, plateau 3D au centre, rosters sur les côtés, dock d'actions en bas. Jeu sombre volontairement mono-thème. */
:root{
  color-scheme:dark;
  --bg:#12151f; --panel:#1a1f2d; --panel2:#222839; --line:#323a52; --txt:#e8ebf4; --mut:#8e97b1;
  --amber:#ffb42e; --white:#f1f3f9; --black:#2b2e3b;
  --A:#ee5b4b; --D:#4a8cf0; --T:#3fc48a; --S:#efbf45;
  --font:'Chakra Petch',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px}
#app{position:absolute;inset:0;user-select:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#badges,#float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 2px #000}
.badge .hp{font-size:12px;letter-spacing:1px;color:#ff6b6b}
.badge .hp i{font-style:normal;color:#ffffff40}
.badge .nm{display:inline-block;padding:0 5px;border-radius:3px;background:#0009;color:#fff}
.badge.t0 .nm{border-bottom:2px solid var(--white)} .badge.t1 .nm{border-bottom:2px solid #777c93}
.badge .fx{font-size:13px}
.flt{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:20px;text-shadow:0 2px 4px #000;animation:flt 1.3s ease-out forwards;white-space:nowrap}
@keyframes flt{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
kbd{font-family:var(--mono);font-weight:700;font-size:11px;background:#0d101a;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--amber);white-space:nowrap}

#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 32px);pointer-events:none}
#banner{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
#banner .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
#banner .dot.t0{background:var(--white)} #banner .dot.t1{background:var(--black);border-color:#8a90aa}
#hint{background:#0c0f18cc;border-radius:6px;padding:5px 12px;color:var(--txt);text-align:center;font-size:13px}
#toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:var(--amber);color:#1b1300;font-weight:700;padding:5px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}

.roster{position:absolute;top:10px;width:212px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 300px);overflow:auto}
#rosterW{left:10px} #rosterB{right:10px}
.rh{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px;color:var(--mut)}
.rh b{color:var(--txt)}
.uc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:6px;padding:5px 8px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 6px}
.uc:hover{background:var(--panel2)}
.uc.sel{outline:2px solid var(--amber)} .uc.played{opacity:.5} .uc.dead{opacity:.28;filter:grayscale(1)}
.uc .nm{font-weight:700} .uc .nm small{color:var(--mut);font-weight:500;margin-left:4px}
.uc .hp{color:#ff6b6b;letter-spacing:1px;text-align:right} .uc .hp i{font-style:normal;color:#ffffff35}
.uc .st{font-family:var(--mono);font-size:11px;color:var(--mut)} .uc .fx{text-align:right;font-size:12px}
.hand{font-size:12px;color:var(--mut);padding:2px 4px}
.hand b{color:var(--amber)}

#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(880px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
#info{min-width:0} #info h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--cc);color:#101010}
.stats{display:flex;gap:10px;font-family:var(--mono);font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.stats span b{color:var(--amber)}
.abil{font-size:12px;color:var(--mut);line-height:1.35} .abil b{color:var(--txt)}
#acts{display:flex;flex-wrap:wrap;gap:6px;align-content:center;justify-content:flex-end;max-width:420px}
.btn{font:inherit;font-size:12px;font-weight:600;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.btn:hover:not(:disabled){border-color:var(--amber)} .btn:disabled{opacity:.38;cursor:not-allowed} .btn.on{border-color:var(--amber);background:#3a2f14}
#pips{grid-column:1/-1;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pips .pip{width:10px;height:10px;border-radius:50%;background:var(--amber)} #pips .pip.off{background:#3a4058}
#cards{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.card{background:#2a2110;border:1px solid var(--amber);border-radius:6px;padding:5px 9px;font-size:12px;max-width:200px}
.card.cur{outline:2px solid #fff} .card b{color:var(--amber)}

#keys{position:absolute;left:10px;bottom:10px;background:#0c0f18d9;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:4px 8px;grid-template-columns:auto 1fr;align-items:center;max-width:250px}
#keys.min > *:not(.kh){display:none}
#keys .kh{grid-column:1/-1;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
#log{position:absolute;right:10px;bottom:10px;width:250px;max-height:190px;overflow:hidden;background:#0c0f18d9;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
#log div{opacity:.9} #log div:last-child{opacity:1;color:#fff} #log .r{color:var(--amber);font-weight:700}

#dice{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#0c0f18f0;border:1px solid var(--amber);border-radius:10px;padding:10px 16px;min-width:300px}
.drow{display:flex;align-items:center;gap:10px;padding:3px 0}
.drow .who{flex:1;font-weight:600;font-size:13px} .drow.t0 .who{color:var(--white)} .drow.t1 .who{color:#a9aec6}
.die{font-style:normal;font-family:var(--mono);font-weight:700;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;background:#eef0f7;color:#12151f;margin-left:4px}
.die.d3{background:#b7bfd8;width:24px;height:24px;font-size:12px}
.drow .sum{font-family:var(--mono);font-size:20px;min-width:34px;text-align:right}
.verdict{text-align:center;font-weight:700;margin-top:4px;color:var(--amber)}

#overlay{position:absolute;inset:0;z-index:20;background:#0a0c14;overflow:auto;padding:18px 16px;display:none}
#overlay.on{display:block}
.ov{max-width:1180px;margin:0 auto}
.ov h1{margin:0;font-size:30px;letter-spacing:.1em;text-transform:uppercase}
.ov h1 span{color:var(--amber)}
.ov p{color:var(--mut);margin:4px 0 12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.dcol{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:8px;align-content:start}
.dcol.cur{border-color:var(--amber)}
.dcol h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
.dc{background:var(--panel2);border:2px solid transparent;border-top:4px solid var(--cc);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px;line-height:1.35}
.dc.sel{border-color:var(--amber);border-top-color:var(--cc)} .dc.t0{opacity:.55;box-shadow:inset 0 0 0 2px var(--white)} .dc.t1{opacity:.55;box-shadow:inset 0 0 0 2px #6b708a}
.dc h5{margin:0 0 3px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline} .dc h5 small{color:var(--mut);font-weight:500;font-size:11px}
.dc .who{font-size:11px;font-weight:700;color:var(--amber)}
.dc p{margin:3px 0 0;color:var(--mut)} .dc p b{color:var(--txt)}
.ovbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px;color:var(--mut);font-size:13px}
.big{font-size:44px;font-weight:700;margin:60px 0 10px;text-align:center}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:20px 0}
.mode{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer}
.mode.sel{border-color:var(--amber)} .mode h2{margin:0 0 6px;font-size:20px;display:flex;gap:10px;align-items:center} .mode p{margin:0;color:var(--mut)}
.ov.pk{display:flex;flex-direction:column;height:100%;max-width:1200px}
.pkhead h1{font-size:22px;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:0}
.slot small{color:var(--cc);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px} .slot b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .slot.empty{color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px} .grow{flex:1}
.tab{font:inherit;font-weight:600;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:3px solid var(--cc);border-radius:6px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--panel2);border-color:var(--amber);border-bottom-color:var(--cc)}
.pgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;padding:2px}
.pc{background:var(--panel);border:2px solid transparent;border-left:4px solid var(--cc);border-radius:8px;padding:6px 9px;cursor:pointer;display:flex;flex-direction:column;position:relative;min-width:0}
.pc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pc small{color:var(--mut);font-size:11px}
.pc.cur{border-color:var(--amber);background:var(--panel2)} .pc.mine{box-shadow:inset 0 0 0 2px var(--T)} .pc.gone{opacity:.35}
.pc em{position:absolute;top:5px;right:8px;font-size:10px;font-style:normal;color:var(--amber);font-weight:700}
.sv{display:flex;gap:10px;font-family:var(--mono);font-weight:700;font-size:13px;margin-top:2px} .sv i{font-style:normal}
.pinfo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:8px;padding:8px 12px;margin-top:8px}
.pinfo h3{margin:0 0 3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .stars{color:var(--amber);font-size:12px;letter-spacing:1px}
@media (min-width:1101px){#dock{width:min(820px,calc(100% - 540px))}}
@media (max-width:1100px){.roster{display:none}#keys{display:none}}
@media (max-width:700px){#log{display:none}#dock{grid-template-columns:1fr}#acts{justify-content:flex-start}}
</style>

<div id="app">
  <canvas id="c" tabindex="0"></canvas>
  <div id="badges"></div><div id="float"></div>
  <div id="top"><div id="banner"></div><div id="hint"></div></div>
  <div id="toast"></div>
  <aside class="roster" id="rosterW"></aside><aside class="roster" id="rosterB"></aside>
  <section id="dock"><div id="info"></div><div id="acts"></div><div id="pips"></div><div id="cards"></div></section>
  <div id="keys"></div>
  <div id="log"></div>
  <div id="dice" hidden></div>
  <div id="overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============ DONNÉES ============ */
const $=s=>document.querySelector(s);
const N=8, TEAMS=['Blancs','Noirs'], KEY=(c,r)=>c+','+r, DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const STRUCT=new Set(['1,3','2,3','5,4','6,4','2,5','2,6','5,2','5,1']);
const SPAWN=[[[1,6],[3,7],[4,7],[6,6]],[[1,1],[3,0],[4,0],[6,1]]];
const CENTER=[[3,3],[4,3],[3,4],[4,4]];
const CLS={A:{n:'Attaque',c:'#ee5b4b',h:0xee5b4b},D:{n:'Défense',c:'#4a8cf0',h:0x4a8cf0},T:{n:'Technique',c:'#3fc48a',h:0x3fc48a},S:{n:'Soutien',c:'#efbf45',h:0xefbf45}};
const ORDER=['A','D','T','S'];
const EFF={burn:['🔥','Brûlé'],toxic:['☣️','Toxique'],stun:['💫','Assommé'],numb:['🩹','Engourdi'],disrupt:['🌌','Bouleversement'],jam:['📡','Brouillage'],frozen:['🧊','Gelé']};
const isStruct=(c,r)=>STRUCT.has(KEY(c,r));
const d6=()=>1+Math.floor(Math.random()*6), d3=()=>1+Math.floor(Math.random()*3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cheb=(a,b)=>Math.max(Math.abs(a.c-b.c),Math.abs(a.r-b.r));
const cellName=(c,r)=>String.fromCharCode(65+c)+(r+1);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* Personnages : stats issues de Projet-Cards.csv (cartes dont les stats sont renseignées).
   Capacités et ultimes : improvisés par rôle, une variante choisie par personnage. */
const ROLE_CLS={Brawler:'A',Performer:'A',Protector:'D',Juggernaut:'D',Ranger:'T',Flanker:'T',Assist:'S',Engineer:'S'};
const rollPop=(u,t)=>{const r=d6();pop(t,'d6 : '+r,'#ffb42e');log(`${u.d.name} lance un d6 : <span class="r">${r}</span>`);return r};
const ENM=(n,x,rad,fn)=>({n,t:'none',aoe:'enemies',rad,x,run:async(u,l)=>{for(const t of l)await fn(u,t)}});
const ALY=(n,x,rad,fn)=>({n,t:'none',aoe:'allies',rad,x,run:async(u,l)=>{for(const a of l)await fn(u,a)}});
const SELF=(n,x,fn)=>({n,t:'none',aoe:'self',rad:0,x,run:fn});
const TGT=(n,x,fn,o={})=>({n,t:'enemy',x,run:fn,...o});
const dashHit=async(u,t,b=0)=>{await teleport(u,freeAdj(t)[0]);if(b)addBuff(u,'atk',b,'self',u);return combat(u,t)};
const PRE1=u=>stat(u,'pre')+1;
const LIB={
 Brawler:{
  ab:[TGT('Souffle ardent','Cible à portée, d6 : 4-6 Brûlé, 6 = −1 PV en plus.',async(u,t)=>{const r=rollPop(u,t);if(r>=4)await addEff(t,'burn',u);if(r===6)await dmg(t,1,u)}),
      TGT('Coup de tonnerre','Cible à portée, d6 : 4-6 Assommé.',async(u,t)=>{if(rollPop(u,t)>=4)await addEff(t,'stun',u)}),
      TGT('Charge','Se téléporte au contact d\'un ennemi à ≤4 cases et combat.',(u,t)=>dashHit(u,t),{far:4,adj:true})],
  ul:[ENM('Inferno','Ennemis à PRE+1 : Brûlés et −1 PV.',PRE1,async(u,t)=>{await addEff(t,'burn',u);await dmg(t,1,u)}),
      SELF('Rage','+1 ATK ce tour et 2 attaques gratuites.',async u=>{u.freeAtk=2;addBuff(u,'atk',1,'self',u);pop(u,'RAGE','#ff9a5a')})]},
 Performer:{
  ab:[{n:'Ruée',t:'cell',cell:3,x:'Se téléporte à ≤3 cases. d6 : 4-6 = +1 ATK ce tour.',run:async(u,c)=>{await teleport(u,c);let r=d6();if(G.variant&&u.flags.rerollAb){u.flags.rerollAb=false;r=Math.max(r,d6())}
        log(`${u.d.name} lance un d6 : <span class="r">${r}</span>`);if(r>=4){addBuff(u,'atk',1,'self',u);pop(u,'+1 ATK','#ff9a5a')}}},
      {n:'Feinte',t:'cell',cell:2,x:'Se téléporte à ≤2 cases et gagne +1 DEF jusqu\'à son prochain tour.',run:async(u,c)=>{await teleport(u,c);addBuff(u,'def',1,'turn',u);pop(u,'+1 DEF','#6aa8ff')}},
      TGT('Éclat troublant','Cible à portée, d6 : 1-2 Brouillage, 3-6 Bouleversement.',async(u,t)=>{await addEff(t,rollPop(u,t)<=2?'jam':'disrupt',u)})],
  ul:[SELF('Blitz','Cette attaque et la suivante ne coûtent aucune action.',async u=>{u.freeAtk=2;pop(u,'BLITZ','#ff9a5a')}),
      ALY('Crescendo','Tous les alliés : +1 ATK jusqu\'à la fin de la manche.',99,async(u,a)=>{addBuff(a,'atk',1,'round',u);pop(a,'+1 ATK','#ff9a5a')})]},
 Protector:{
  ab:[ALY('Rempart','Alliés à ≤2 cases (lui compris) : +1 DEF jusqu\'à son prochain tour.',2,async(u,a)=>{addBuff(a,'def',1,'turn',u);pop(a,'+1 DEF','#6aa8ff')}),
      ENM('Provocation','Ennemis à PRE+1 : Engourdis.',PRE1,(u,t)=>addEff(t,'numb',u)),
      ALY('Barrière','Alliés au contact : +1 DEF ; lui : +2 DEF, jusqu\'à son prochain tour.',1,async(u,a)=>{addBuff(a,'def',a===u?2:1,'turn',u);pop(a,'+DEF','#6aa8ff')})],
  ul:[ALY('Forteresse','Tous les alliés : +2 DEF jusqu\'à son prochain tour. Il se soigne de 1 PV.',99,async(u,a)=>{addBuff(a,'def',2,'turn',u);pop(a,'+2 DEF','#6aa8ff');if(a===u)heal(u,1)}),
      ENM('Contre-choc','Ennemis à PRE+1 : −1 PV et Brouillage.',PRE1,async(u,t)=>{await dmg(t,1,u);if(t.alive)await addEff(t,'jam',u)})]},
 Juggernaut:{
  ab:[ENM('Séisme','Ennemis à PRE+1 : Engourdis.',PRE1,(u,t)=>addEff(t,'numb',u)),
      TGT('Poing lourd','Cible à portée, d6 : 3-6 Assommé.',async(u,t)=>{if(rollPop(u,t)>=3)await addEff(t,'stun',u)}),
      SELF('Cuirasse','+2 DEF jusqu\'à son prochain tour.',async u=>{addBuff(u,'def',2,'turn',u);pop(u,'+2 DEF','#6aa8ff')})],
  ul:[ENM('Écrasement','Ennemis à PRE+1 : Assommés et −1 PV.',PRE1,async(u,t)=>{await addEff(t,'stun',u);await dmg(t,1,u)}),
      SELF('Colosse','+2 ATK et +2 DEF jusqu\'à son prochain tour, +1 PV.',async u=>{addBuff(u,'atk',2,'turn',u);addBuff(u,'def',2,'turn',u);heal(u,1);pop(u,'COLOSSE','#6aa8ff')})]},
 Ranger:{
  ab:[TGT('Marque','Cible à portée : −1 DEF jusqu\'au prochain tour du tireur.',async(u,t)=>{addBuff(t,'def',-1,'turn',u);pop(t,'−1 DEF','#5fe0a5')}),
      TGT('Tir toxique','Cible à portée : Toxique.',(u,t)=>addEff(t,'toxic',u)),
      TGT('Tir d\'entrave','Cible à portée : Engourdie ; d6 4-6 = −1 DEF en plus.',async(u,t)=>{await addEff(t,'numb',u);if(rollPop(u,t)>=4){addBuff(t,'def',-1,'turn',u)}})],
  ul:[TGT('Tir fatal','Cible à ≤6 cases (sans obstacle) : −2 PV.',(u,t)=>dmg(t,2,u),{far:6}),
      ENM('Pluie de plomb','Ennemis à ≤4 cases : −1 PV.',4,(u,t)=>dmg(t,1,u))]},
 Flanker:{
  ab:[{n:'Clignotement',t:'cell',cell:4,x:'Se téléporte sur une case libre à ≤4 cases.',run:(u,c)=>teleport(u,c)},
      TGT('Coup d\'ombre','Se téléporte au contact d\'un ennemi à ≤3 cases et combat.',(u,t)=>dashHit(u,t),{far:3,adj:true}),
      ENM('Fumigène','Ennemis à ≤2 cases : Brouillage.',2,(u,t)=>addEff(t,'jam',u))],
  ul:[TGT('Frappe venimeuse','Se téléporte au contact d\'un ennemi à ≤5 cases, +1 ATK, combat. Si touché : Toxique.',async(u,t)=>{if(await dashHit(u,t,1)==='hit')await addEff(t,'toxic',u)},{far:5,adj:true}),
      TGT('Assassinat','Se téléporte au contact d\'un ennemi à ≤5 cases, +2 ATK, combat.',(u,t)=>dashHit(u,t,2),{far:5,adj:true})]},

function buildUnit(d,team){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);const mats=[];
  const M=col=>{const m=mat(col);m.userData.col=new THREE.Color(col);mats.push(m);return m};
  const add=(geo,m,x=0,y=0,z=0)=>{const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.castShadow=true;body.add(me);return me};
  const col=new THREE.Color(CLS[d.cls].h).offsetHSL(((d.num*37)%24-12)/360,0,((d.num*13)%9-4)/100).getHex(),light=new THREE.Color(col).lerp(new THREE.Color(0xffffff),.4).getHex(),dark=new THREE.Color(col).multiplyScalar(.55).getHex();
  const idx=d.num%2;
  add(new THREE.CylinderGeometry(0.38,0.42,0.12,6),M(team===0?0xf2f4fa:0x22242e),0,0.06,0);
  const ring=add(new THREE.TorusGeometry(0.37,0.035,4,6),M(col),0,0.13,0);ring.rotation.x=Math.PI/2;
  if(d.cls==='A'){const b=add(new THREE.OctahedronGeometry(0.33,0),M(col),0,0.56,0);b.scale.y=1.4;
    add(new THREE.ConeGeometry(0.09,0.34,4),M(light),-0.3,0.78,0).rotation.z=0.55;add(new THREE.ConeGeometry(0.09,0.34,4),M(light),0.3,0.78,0).rotation.z=-0.55;
    if(idx===1)add(new THREE.ConeGeometry(0.1,0.3,4),M(dark),0,1.08,0)}
  else if(d.cls==='D'){add(new THREE.CylinderGeometry(0.3,0.36,0.6,6),M(col),0,0.42,0);add(new THREE.BoxGeometry(0.22,0.2,0.5),M(light),-0.36,0.68,0);add(new THREE.BoxGeometry(0.22,0.2,0.5),M(light),0.36,0.68,0);
    add(new THREE.BoxGeometry(0.34,0.24,0.34),M(dark),0,0.86,0);if(idx===1)add(new THREE.BoxGeometry(0.5,0.1,0.5),M(light),0,1.02,0)}
  else if(d.cls==='T'){add(new THREE.ConeGeometry(0.3,0.95,5),M(col),0,0.6,0);add(new THREE.IcosahedronGeometry(0.19,0),M(light),0,1.2,0);
    if(idx===1){add(new THREE.BoxGeometry(0.5,0.05,0.14),M(dark),0,1.2,0.12)}else{add(new THREE.CylinderGeometry(0.04,0.04,0.7,4),M(dark),0.3,0.75,0).rotation.z=-0.3}}
  else {const b=add(new THREE.IcosahedronGeometry(0.31,0),M(col),0,0.6,0);
    const rg=add(new THREE.TorusGeometry(0.4,0.05,4,8),M(light),0,0.6,0);rg.rotation.x=Math.PI/2.3;g.userData.ring=rg;
    if(idx===1)add(new THREE.CylinderGeometry(0.03,0.03,0.4,4),M(dark),0,1.1,0);else add(new THREE.OctahedronGeometry(0.11,0),M(light),0,1.05,0)}
  g.userData.body=body;g.userData.mats=mats;scene.add(g);return g;
}

/* animations */
const tweens=[];
const tween=(dur,fn)=>new Promise(res=>{tweens.push({t:0,dur,fn,res})});
function stepTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const k=Math.min(1,w.t/w.dur);w.fn(k);if(k>=1){tweens.splice(i,1);w.res()}}}
async function walk(u,path){for(const [c,r] of path){const a=u.mesh.position.clone(),b=cellPos(c,r);await tween(.13,k=>{u.mesh.position.lerpVectors(a,b,k);u.mesh.position.y+=Math.sin(k*Math.PI)*.16});u.c=c;u.r=r}}
async function teleport(u,cell){await tween(.16,k=>u.mesh.scale.setScalar(1-k));u.c=cell.c;u.r=cell.r;u.mesh.position.copy(cellPos(cell.c,cell.r));await tween(.16,k=>u.mesh.scale.setScalar(k));
  if(G.token&&u.c===G.token.c&&u.r===G.token.r)await collectToken(u)}
const shake=u=>tween(.3,k=>{u.mesh.userData.body.position.x=Math.sin(k*34)*(1-k)*.09;});
async function lunge(a,t){const p=a.mesh.position.clone(),q=t.mesh.position.clone().sub(p).setY(0).normalize().multiplyScalar(.35);
  await tween(.12,k=>a.mesh.position.copy(p).addScaledVector(q,k));await tween(.14,k=>a.mesh.position.copy(p).addScaledVector(q,1-k))}

function spawnUnit(d,team,c,r){const u={id:G.nid++,d,team,c,r,hp:4,alive:true,played:false,effect:null,buffs:[],flags:{},freeAtk:0};
  u.mesh=buildUnit(d,team);u.mesh.position.copy(cellPos(c,r));u.mesh.rotation.y=team===0?0:Math.PI;G.units.push(u);return u}
function log(h){const el=document.createElement('div');el.innerHTML=h;const L=$('#log');L.appendChild(el);while(L.children.length>9)L.firstChild.remove()}
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1700)};
const v3=new THREE.Vector3();
function screenOf(pos,dy=0){v3.copy(pos);v3.y+=dy;v3.project(cam);return[(v3.x*.5+.5)*innerWidth,(-v3.y*.5+.5)*innerHeight]}
function pop(u,text,color='#fff'){const el=document.createElement('div');el.className='flt';el.textContent=text;el.style.color=color;
  const [x,y]=screenOf(u.mesh.position,1.2);el.style.left=x+'px';el.style.top=y+'px';$('#float').appendChild(el);setTimeout(()=>el.remove(),1400)}
function addBuff(u,k,v,until,src){u.buffs.push({k,v,until,src:src.id});refresh()}
function heal(u,n){const b=u.hp;u.hp=Math.min(4,u.hp+n);if(u.hp>b){pop(u,'+'+(u.hp-b)+' PV','#5fe0a5');log(`${u.d.name} récupère ${u.hp-b} PV`);if(u.effect&&u.effect.type==='toxic')u.effect=null}refresh()}
function cleanse(u){if(u.effect){pop(u,'Purgé','#5fe0a5');u.effect=null}refresh()}
async function addEff(t,type,src){
  if(t.effect&&t.effect.src!==src.id){pop(t,'Déjà affecté','#aaa');log(`${t.d.name} a déjà un effet`);return}
  t.effect={type,src:src.id,left:type==='toxic'?2:1};pop(t,EFF[type][0]+' '+EFF[type][1],'#ffd27a');log(`${t.d.name} : ${EFF[type][0]} ${EFF[type][1]}`);refresh();await sleep(250)}
async function dmg(t,n,src,fromCombat=false){
  if(!t.alive)return false;
  if(sub(t)==='Juggernaut'&&t.hp===4&&!fromCombat){pop(t,'Résiste','#9cf');log(`${t.d.name} (Juggernaut) ignore ce dégât : 1er PV uniquement par combat`);return false}
  t.hp=Math.max(0,t.hp-n);pop(t,'−'+n,'#ff6b6b');log(`${t.d.name} perd ${n} PV (${t.hp}/4)`);shake(t);refresh();await sleep(280);
  if(t.hp<=0)await ko(t,src);return true}
async function ko(t,src){t.alive=false;log(`<b>${t.d.name} est K.O. !</b>`);pop(t,'K.O.','#ff6b6b');
  G.units.forEach(x=>x.buffs=x.buffs.filter(b=>b.src!==t.id||b.until==='self'));
  await tween(.4,k=>t.mesh.scale.setScalar(1-k));t.mesh.visible=false;
  if(src&&src.alive!==undefined&&src.team!==t.team)drawCard(src.team,'K.O.');
  checkWin();refresh()}
function checkWin(){if(G.phase==='over')return;for(const t of[0,1])if(alive(t).length===0){G.phase='over';G.over=1-t;showOver()}}
function drawCard(team,why){const c=G.deck[team].pop();if(!c){G.deck[team]=newDeck();return drawCard(team,why)}G.hand[team].push(c);log(`${TEAMS[team]} piochent un renfort : <b>${c.n}</b> (${why})`);toast(`${TEAMS[team]} : renfort « ${c.n} »`);refresh()}
const freeAdj=t=>{const o=[];for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){if(!dc&&!dr)continue;const c=t.c+dc,r=t.r+dr;if(c<0||r<0||c>=N||r>=N||unitAt(c,r))continue;o.push({c,r})}return o};

/* jeton renfort + roue */
function spinWheel(first){for(let i=0;i<20;i++){let c=Math.floor(Math.random()*N),r=Math.floor(Math.random()*N);if(first){[c,r]=CENTER[Math.floor(Math.random()*4)]}
  if(isStruct(c,r))continue;const u=unitAt(c,r);if(u){drawCard(u.team,'roue');continue}G.token={c,r};log(`Roue : nouveau jeton renfort en <span class="r">${cellName(c,r)}</span>`);break}
  syncToken()}
function syncToken(){if(G.token){tokenM.visible=true;tokenM.position.copy(cellPos(G.token.c,G.token.r))}else tokenM.visible=false}
async function collectToken(u){drawCard(u.team,`${u.d.name} atteint le jeton`);G.token=null;syncToken();spinWheel(false)}

/* ============ PORTÉE / DÉPLACEMENT ============ */
function lineCells(a,b){const n=Math.max(Math.abs(b.c-a.c),Math.abs(b.r-a.r)),o=[];for(let i=1;i<n;i++)o.push([Math.round(a.c+(b.c-a.c)*i/n),Math.round(a.r+(b.r-a.r)*i/n)]);return o}
/* 0 hors portée, 1 ok, 2 « solo » (PRE 1 vers le niveau supérieur : action unique) */
function rangeState(u,t){
  const d=cheb(u,t),rg=sub(u)==='Ranger',us=isStruct(u.c,u.r),ts=isStruct(t.c,t.r);let pre=stat(u,'pre');
  if(!rg){if(us&&!ts)pre++;if(!us&&ts)pre--;if(!(us&&ts))pre-=lineCells(u,t).filter(([c,r])=>isStruct(c,r)).length}
  if(d<=pre)return 1;
  if(!rg&&!us&&ts&&d===1&&stat(u,'pre')===1&&!G.committed)return 2;return 0}
function reachable(u){
  const out=new Map();if(u.effect&&u.effect.type==='numb')return out;
  const flank=sub(u)==='Flanker',k0=KEY(u.c,u.r);out.set(k0,{rem:stat(u,'hab'),prev:null,c:u.c,r:u.r});const q=[k0];
  while(q.length){const k=q.shift(),cur=out.get(k);
    for(const[dc,dr] of DIRS){const c=cur.c+dc,r=cur.r+dr;if(c<0||r<0||c>=N||r>=N||unitAt(c,r))continue;
      const lvl=isStruct(c,r)!==isStruct(cur.c,cur.r);let rem=cur.rem-(lvl&&!flank?2:1);
      if(rem<0){if(lvl&&cur.rem>=1)rem=0;else continue}   // monter/descendre coûte 1 HAB de plus ; HAB 1 peut toujours le faire seul
      const kk=KEY(c,r),ex=out.get(kk);if(!ex||ex.rem<rem){out.set(kk,{rem,prev:k,c,r});q.push(kk)}}}
  return out}
function pathTo(u,reach,dest){const p=[];let k=KEY(dest.c,dest.r);while(k&&k!==KEY(u.c,u.r)){const n=reach.get(k);p.unshift([n.c,n.r]);k=n.prev}return p}
function targetsFor(u,s){
  if(s.t==='enemy')return alive(1-u.team).filter(t=>s.far?(cheb(u,t)<=s.far&&(!s.adj||freeAdj(t).length)):rangeState(u,t)===1);
  if(s.t==='ally')return alive(u.team).filter(t=>t===u||cheb(u,t)<=stat(u,'pre')+(isStruct(u.c,u.r)?1:0));
  if(s.t==='cell'){const o=[],cr=typeof s.cell==='function'?s.cell(u):s.cell;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!unitAt(c,r)&&cheb(u,{c,r})<=cr)o.push({c,r});return o}
  const rad=typeof s.rad==='function'?s.rad(u):s.rad;
  const pool=s.aoe==='enemies'?alive(1-u.team):s.aoe==='allies'?alive(u.team):[u];return pool.filter(t=>cheb(u,t)<=rad)}

/* ============ COMBAT ============ */
const rollSet=n=>{const a=[d6()];for(let i=1;i<n;i++)a.push(d3());return a};
const sum=a=>a.reduce((x,y)=>x+y,0);
function paintDice(att,def,A,D,verdict){
  const row=(u,arr,role)=>`<div class="drow t${u.team}"><span class="who">${role} · ${u.d.name}</span><span>${arr.map((v,i)=>`<i class="die ${i?'d3':''}">${v}</i>`).join('')}</span><b class="sum">${sum(arr)}</b></div>`;
  $('#dice').innerHTML=row(att,A,'ATK')+row(def,D,'DEF')+(verdict?`<div class="verdict">${verdict}</div>`:'')}
async function showDice(att,def,A,D,verdict){const el=$('#dice');el.hidden=false;clearTimeout(showDice.h);
  for(let i=0;i<9;i++){paintDice(att,def,rollSet(A.length),rollSet(D.length));await sleep(65)}
  paintDice(att,def,A,D,verdict);await sleep(900);showDice.h=setTimeout(()=>el.hidden=true,2200)}
async function combat(att,def){
  let A=rollSet(stat(att,'atk')),D=rollSet(stat(def,'def'));
  if(sub(att)==='Brawler'&&att.flags.rerollAtk){att.flags.rerollAtk=false;if(A[0]<=3){const o=A[0];A[0]=d6();log(`Brawler relance son d6 (${o} → ${A[0]})`)}}
  const sa=sum(A),sd=sum(D);
  const verdict=sa>sd?`${def.d.name} perd 1 PV`:sa<sd?'Défense réussie':(sub(att)==='Protector'||sub(def)==='Protector')?'Égalité (Protector)':'Égalité : rien';
  log(`<b>${att.d.name}</b> ${sa} vs <b>${def.d.name}</b> ${sd}`);
  await lunge(att,def);await showDice(att,def,A,D,verdict);
  if(sa>sd){await dmg(def,1,att,true);
    if(att.alive){if(sub(att)==='Brawler')att.flags.rerollAtk=true;
      if(sub(att)==='Assist'){const r=d3();log(`Assist : d3 = ${r}`);if(r>=2){const al=alive(att.team).filter(a=>a.hp<4).sort((a,b)=>a.hp-b.hp)[0];if(al)heal(al,1)}}}
    return'hit'}
  if(sa<sd){if(sub(def)==='Performer')def.flags.rerollAb=true;
    if(sub(def)==='Engineer'){const r=d3();log(`Engineer : d3 = ${r}`);if(r>=2)heal(def,1)}return'block'}
  if(sub(att)==='Protector')await dmg(def,1,att,true);else if(sub(def)==='Protector')await dmg(att,1,def,true);return'tie'}

/* ============ TOURS ============ */
function beginRound(){G.round++;G.turnPlayer=(G.round-1)%2;G.units.forEach(u=>u.played=false);G.sel=null;G.mode='idle';
  log(`<span class="r">— Manche ${G.round} —</span> ${TEAMS[G.turnPlayer]} commencent`);focusNext();refresh()}
function focusNext(){const u=alive(G.turnPlayer).find(x=>!x.played);if(u)G.cur={c:u.c,r:u.r}}
function selectUnit(u){G.sel=u;G.committed=false;G.used={move:false,atk:false,abl:false,card:false};
  G.actions=(u.effect&&u.effect.type==='stun')?1:2;G.mode=(u.effect&&u.effect.type==='frozen')?'frozen':'sel';
  if(G.actions===1)toast('Assommé : une seule action ce tour');recalc();refresh()}
function commit(){if(G.committed)return;G.committed=true;const u=G.sel;u.buffs=u.buffs.filter(b=>!(b.until==='turn'&&b.src===u.id))}
async function after(){G.busy=false;if(G.phase==='over')return;
  if(G.actions<=0&&!(G.sel.freeAtk>0&&attackTargets(G.sel).length)){await sleep(300);await endTurn()}else{G.mode='sel';recalc();refresh()}}
async function endTurn(){const u=G.sel;if(!u||G.busy&&false)return;G.busy=true;
  u.played=true;u.buffs=u.buffs.filter(b=>b.until!=='self');u.freeAtk=0;
  if(u.effect&&['stun','numb','disrupt','jam','frozen'].includes(u.effect.type))u.effect=null;
  G.sel=null;G.mode='idle';G.hl=new Map();
  const other=1-G.turnPlayer,av=t=>alive(t).some(x=>!x.played);
  if(av(other))G.turnPlayer=other;else if(!av(G.turnPlayer)){await endRound()}
  if(G.phase==='over'){G.busy=false;return}
  focusNext();G.busy=false;recalc();refresh()}
async function endRound(){
  for(const u of[...G.units]){if(!u.alive||!u.effect)continue;
    if(u.effect.type==='toxic'){log(`${u.d.name} souffre du poison`);const l=--u.effect.left;await dmg(u,1,null);if(u.alive&&l<=0)u.effect=null}
    else if(u.effect.type==='burn'){const r=d6();log(`Brûlure de ${u.d.name} : d6 = ${r}`);if(r<=3){u.effect=null;pop(u,'Éteint','#9cf')}else await dmg(u,1,null)}
    if(G.phase==='over')return}
  G.units.forEach(u=>u.buffs=u.buffs.filter(b=>b.until!=='round'));
  await sleep(250);beginRound()}

/* actions du joueur */
function attackTargets(u){const o=[];for(const t of alive(1-u.team)){const s=rangeState(u,t);if(s)o.push({t,solo:s===2})}return o}
function can(cmd){const u=G.sel;if(!u)return[false,'Aucun personnage'];if(G.mode==='frozen')return[false,'Gelé'];const eff=u.effect&&u.effect.type;
  switch(cmd){
   case'move':if(G.used.move)return[false,'Déjà déplacé'];if(G.actions<=0)return[false,'Plus d\'actions'];if(eff==='numb')return[false,'Engourdi'];if(reachable(u).size<2)return[false,'Aucune case'];return[true];
   case'atk':if(u.freeAtk>0)return attackTargets(u).length?[true]:[false,'Personne à portée'];if(G.used.atk)return[false,'Déjà attaqué'];if(G.actions<=0)return[false,'Plus d\'actions'];
     return attackTargets(u).length?[true]:[false,'Personne à portée'];
   case'abl':case'ult':{const s=cmd==='abl'?u.d.ab:u.d.ul;if(G.used.abl)return[false,'Capacité déjà utilisée'];if(G.actions<=0)return[false,'Plus d\'actions'];if(eff==='disrupt')return[false,'Bouleversement'];
     if(cmd==='ult'){if(G.round<2)return[false,'Dès la manche 2'];if(G.ult[u.team])return[false,'Ultime déjà utilisé']}
     return targetsFor(u,s).length?[true]:[false,'Aucune cible']}
   case'card':if(G.used.card)return[false,'1 renfort par tour'];if(!G.hand[u.team].length)return[false,'Aucun renfort'];if(eff==='jam')return[false,'Brouillage'];return[true]}}
async function doMove(dest){const u=G.sel,reach=reachable(u);G.busy=true;commit();const p=pathTo(u,reach,dest);G.hl=new Map();paintHL();
  await walk(u,p);G.used.move=true;G.actions--;log(`${u.d.name} → ${cellName(u.c,u.r)}`);
  if(G.token&&u.c===G.token.c&&u.r===G.token.r)await collectToken(u);await after()}
async function doAttack(t,solo){const u=G.sel;G.busy=true;commit();G.hl=new Map();paintHL();
  if(u.freeAtk>0)u.freeAtk--;else{G.actions--;G.used.atk=true}
  if(solo)G.actions=0;await combat(u,t);await after()}
async function doAbility(isUlt,tg){const u=G.sel,s=isUlt?u.d.ul:u.d.ab;G.busy=true;commit();G.hl=new Map();paintHL();
  G.actions--;G.used.abl=true;if(isUlt)G.ult[u.team]=true;
  log(`<b>${u.d.name}</b> utilise ${isUlt?'l\'ultime ':''}<span class="r">${s.n}</span>`);pop(u,s.n,'#d9b8ff');
  await s.run(u,tg);await sleep(200);if(G.phase==='over')return;await after()}
async function useCard(i){const u=G.sel,c=G.hand[u.team][i];G.busy=true;commit();G.hand[u.team].splice(i,1);G.used.card=true;
  log(`<b>${u.d.name}</b> joue le renfort <span class="r">${c.n}</span>`);await c.use(u);await sleep(200);G.mode='sel';await after()}

/* ============ SURBRILLANCES ============ */
function recalc(){G.hl=new Map();G.solo=new Set();
  if(G.phase==='place'){const team=G.pl%2;SPAWN[team].forEach(([c,r])=>{if(!unitAt(c,r))G.hl.set(KEY(c,r),'place')});paintHL();return}
  const u=G.sel;if(!u||G.phase!=='play'){paintHL();return}
  if(G.mode==='move'){for(const[k] of reachable(u))if(k!==KEY(u.c,u.r))G.hl.set(k,'move')}
  else if(G.mode==='atk'){for(const{t,solo} of attackTargets(u)){G.hl.set(KEY(t.c,t.r),'atk');if(solo)G.solo.add(KEY(t.c,t.r))}}
  else if(G.mode==='abl'||G.mode==='ult'){const s=G.mode==='abl'?u.d.ab:u.d.ul,ts=targetsFor(u,s);
    for(const t of ts)G.hl.set(KEY(t.c,t.r),s.t==='ally'?'ally':'abl')}
  paintHL()}

/* ============ HUD ============ */
const hearts=u=>'♥'.repeat(u.hp)+'<i>'+'♥'.repeat(4-u.hp)+'</i>';
const fxIcon=u=>u.effect?EFF[u.effect.type][0]:'';
function refresh(){
  if(G.phase==='menu'||G.phase==='pick'){$('#dock').style.display='none';renderTop();renderRosters();return}
  $('#dock').style.display='grid';renderTop();renderRosters();renderDock()}
function renderTop(){
  const b=$('#banner'),h=$('#hint');
  if(G.phase==='menu'||G.phase==='pick'){b.innerHTML='<b>Sélection des personnages</b>';h.innerHTML='';return}
  if(G.phase==='place'){const t=G.pl%2,d=G.picks[t][Math.floor(G.pl/2)];b.innerHTML=`<span class="dot t${t}"></span>Placement · ${TEAMS[t]}`;h.innerHTML=`Place <b>${d.name}</b> sur une case jaune : <kbd>←↑↓→</kbd> puis <kbd>Entrée</kbd> · <kbd>X</kbd> placement auto`;return}
  if(G.phase==='over'){b.innerHTML='<b>Partie terminée</b>';h.innerHTML='';return}
  b.innerHTML=`<span>Manche ${G.round}</span><span class="dot t${G.turnPlayer}"></span><span>Tour des ${TEAMS[G.turnPlayer]}${G.bot&&G.turnPlayer===1?' (bot)':''}</span>`;
  const m=G.mode,u=G.sel;let t='';
  if(m==='idle'&&G.bot&&G.turnPlayer===1)t='Le bot réfléchit…';
  else if(m==='idle')t=`Choisis un personnage <kbd>Entrée</kbd> ou <kbd>Tab</kbd> pour passer au suivant`;
  else if(m==='frozen')t=`${u.d.name} est gelé 🧊 : <kbd>F</kbd> briser la glace (−1 PV) et jouer · <kbd>E</kbd> passer son tour`;
  else if(m==='sel')t=`Actions restantes : ${G.actions} · <kbd>1</kbd> Déplacer <kbd>2</kbd> Attaquer <kbd>3</kbd> Capacité <kbd>4</kbd> Ultime <kbd>5</kbd> Renfort <kbd>E</kbd> Fin`;
  else if(m==='move')t='Choisis une case bleue · <kbd>Entrée</kbd> valider · <kbd>Échap</kbd> annuler';
  else if(m==='atk')t='Choisis un ennemi rouge · <kbd>Entrée</kbd> attaquer · <kbd>Échap</kbd> annuler';
  else if(m==='abl'||m==='ult'){const s=m==='abl'?u.d.ab:u.d.ul;t=s.t==='none'?`${s.n} : <kbd>Entrée</kbd> pour lancer (unités concernées en violet/vert)`:`${s.n} : choisis une cible en surbrillance · <kbd>Entrée</kbd>`}
  else if(m==='card')t='<kbd>↑↓</kbd> choisir · <kbd>Entrée</kbd> jouer · <kbd>Échap</kbd> annuler';
  h.innerHTML=t}
function ucHTML(u){return`<div class="uc ${G.sel===u?'sel':''} ${u.played&&u.alive?'played':''} ${u.alive?'':'dead'}" data-id="${u.id}" style="--cc:${CLS[u.d.cls].c}">
  <div class="nm">${u.d.name}<small>${u.d.sub}</small></div><div class="hp">${hearts(u)}</div>
  <div class="st">ATK ${stat(u,'atk')} DEF ${stat(u,'def')} HAB ${stat(u,'hab')} PRE ${stat(u,'pre')}</div><div class="fx">${fxIcon(u)}${u.played&&u.alive?' ✔':''}</div></div>`}
function renderRosters(){[0,1].forEach(t=>{const us=G.units.filter(u=>u.team===t);
  $(t?'#rosterB':'#rosterW').innerHTML=`<div class="rh"><b>${TEAMS[t]}</b><span>Renforts : ${G.hand[t].length} · Ult ${G.ult[t]?'✖':'✔'}</span></div>`+us.map(ucHTML).join('')})
  document.querySelectorAll('.uc').forEach(el=>el.onclick=()=>{const u=G.units.find(x=>x.id==el.dataset.id);if(!u)return;G.cur={c:u.c,r:u.r};if(G.phase==='play'&&!G.busy&&G.mode==='idle')confirmAct()})}
function renderDock(){
  const insp=G.sel||(G.phase==='play'?unitAt(G.cur.c,G.cur.r):null),info=$('#info'),acts=$('#acts'),pips=$('#pips'),cards=$('#cards');
  if(!insp){info.innerHTML=G.phase==='place'?'<div class="abil">Place tes 4 personnages sur les cases de départ de ton camp.</div>':'<div class="abil">Déplace le curseur sur un personnage pour voir ses stats.</div>';acts.innerHTML='';pips.innerHTML='';cards.innerHTML='';return}
  const u=insp,d=u.d;
  info.innerHTML=`<h3 style="--cc:${CLS[d.cls].c}">${d.name}<span class="chip">${CLS[d.cls].n} · ${d.sub}</span><span style="color:var(--mut);font-weight:500;font-size:12px">${TEAMS[u.team]} · ${hearts(u)} ${u.effect?EFF[u.effect.type][0]+' '+EFF[u.effect.type][1]:''}</span></h3>
   <div class="stats"><span>ATK <b>${stat(u,'atk')}</b></span><span>DEF <b>${stat(u,'def')}</b></span><span>HAB <b>${stat(u,'hab')}</b></span><span>PRE <b>${stat(u,'pre')}</b></span></div>
   <div class="abil"><b>${d.ab.n}</b> — ${d.ab.x}<br><b>Ultime · ${d.ul.n}</b> — ${d.ul.x}${G.variant?`<br><b>${d.sub}</b> — ${SUBTXT[d.sub]}`:''}</div>`;
  if(G.sel!==u||G.phase!=='play'){acts.innerHTML='';pips.innerHTML='';cards.innerHTML='';return}
  const B=(k,label,cmd,on)=>{const[ok,why]=can(cmd);return`<button class="btn ${on?'on':''}" data-cmd="${cmd}" ${ok?'':'disabled'} title="${why||''}"><kbd>${k}</kbd>${label}${ok?'':` <small style="color:var(--mut)">(${why})</small>`}</button>`};
  acts.innerHTML=G.mode==='frozen'?`<button class="btn" data-cmd="thaw"><kbd>F</kbd>Briser (−1 PV)</button><button class="btn" data-cmd="end"><kbd>E</kbd>Passer</button>`:
   B(1,'Déplacer','move',G.mode==='move')+B(2,'Attaquer','atk',G.mode==='atk')+B(3,d.ab.n,'abl',G.mode==='abl')+B(4,'Ult · '+d.ul.n,'ult',G.mode==='ult')+B(5,`Renfort (${G.hand[u.team].length})`,'card',G.mode==='card')+`<button class="btn" data-cmd="end"><kbd>E</kbd>Fin de tour</button>`;
  acts.querySelectorAll('button').forEach(b=>b.onclick=()=>command(b.dataset.cmd));
  pips.innerHTML=`Actions : ${[0,1].map(i=>`<span class="pip ${i<G.actions?'':'off'}"></span>`).join('')}${u.freeAtk>0?` · Blitz : ${u.freeAtk} attaque(s) gratuite(s)`:''}${u.buffs.length?' · Bonus : '+u.buffs.map(b=>`${b.v>0?'+':''}${b.v} ${b.k.toUpperCase()}`).join(', '):''}`;
  const hand=G.hand[u.team];cards.innerHTML=hand.map((c,i)=>`<div class="card ${G.mode==='card'&&i===G.cardIdx?'cur':''}"><b>${c.n}</b><br>${c.x}</div>`).join('')}
function renderBadges(){const el=$('#badges');let h='';for(const u of G.units){if(!u.alive||!u.mesh.visible)continue;const[x,y]=screenOf(u.mesh.position,1.35);
  h+=`<div class="badge t${u.team}" style="left:${x}px;top:${y}px"><div class="fx">${fxIcon(u)}</div><div class="hp">${hearts(u)}</div><span class="nm">${u.d.name}</span></div>`}
  if(el._h!==h){el.innerHTML=h;el._h=h}}
function renderKeys(){const K=[['←↑↓→ / WASD','Curseur'],['Entrée / Espace','Valider'],['Tab','Perso suivant'],['1','Déplacer'],['2','Attaquer'],['3','Capacité'],['4','Ultime (manche 2+)'],['5','Carte renfort'],['E','Fin de tour'],['Échap','Annuler'],['V','Vue plongeante/inclinée'],['+ / −','Zoom'],['H','Masquer l\'aide']];
  $('#keys').innerHTML='<div class="kh"><span>Contrôles</span><kbd>H</kbd></div>'+K.map(([k,t])=>`<kbd>${k}</kbd><span>${t}</span>`).join('')}

/* ============ MENU, SÉLECTION & PLACEMENT ============ */
function resetGame(){G.units.forEach(u=>scene.remove(u.mesh));G.units=[];G.picks=[[],[]];G.round=0;G.hand=[[],[]];G.deck=[newDeck(),newDeck()];G.ult=[false,false];G.sel=null;G.mode='idle';G.token=null;G.over=null;G.busy=false;G.botRun=false;
  $('#log').innerHTML='';$('#dice').hidden=true;G.hl=new Map();paintHL();syncToken()}
function startMenu(){resetGame();G.phase='menu';G.menuSel=G.bot?1:0;showMenu();refresh()}
function showMenu(){const ov=$('#overlay');ov.className='on';
  ov.innerHTML=`<div class="ov"><h1>New <span>Era</span> Arena</h1><p>Duel tactique au tour par tour. Chaque camp compose une équipe de 4 personnages, un par classe.</p>
   <div class="modes"><div class="mode ${G.menuSel===0?'sel':''}" data-m="0"><h2><kbd>1</kbd> Deux joueurs</h2><p>Blancs et Noirs jouent chacun leur tour sur le même clavier.</p></div>
   <div class="mode ${G.menuSel===1?'sel':''}" data-m="1"><h2><kbd>2</kbd> Contre le bot</h2><p>Tu joues les Blancs. Le bot (niveau facile) joue les Noirs : il hésite, se trompe et attaque sans stratégie.</p></div></div>
   <div class="ovbar"><span><kbd>←</kbd> <kbd>→</kbd> choisir</span><span><kbd>Entrée</kbd> continuer</span><span><kbd>B</kbd> Variante avancée : <b style="color:var(--amber)">${G.variant?'ACTIVE':'désactivée'}</b></span></div></div>`;
  ov.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{G.menuSel=+el.dataset.m;menuGo()})}
function menuGo(){G.bot=G.menuSel===1;startPick()}
function startPick(){G.phase='pick';G.pickTeam=0;G.ptab='A';G.pidx=0;G.picks=[[],[]];showPick();refresh()}
const takenBy=d=>G.picks[0].includes(d)?0:G.picks[1].includes(d)?1:-1;
const poolOf=c=>CHARS.filter(d=>d.cls===c);
function showPick(){const ov=$('#overlay');ov.className='on';const t=G.pickTeam,mine=G.picks[t],list=poolOf(G.ptab);G.pidx=Math.max(0,Math.min(list.length-1,G.pidx));const cur=list[G.pidx];
  const prevScroll=(ov.querySelector('.pgrid')||{}).scrollTop||0;
  const slot=c=>{const d=mine.find(x=>x.cls===c);return`<div class="slot ${d?'':'empty'}" style="--cc:${CLS[c].c}"><small>${CLS[c].n}</small>${d?`<b>${d.name}</b>`:'—'}</div>`};
  const st=d=>`<span class="sv"><i style="color:#ee7b6e">${d.atk}</i><i style="color:#6aa8ff">${d.def}</i><i style="color:#c48cff">${d.hab}</i><i style="color:#ffd05a">${d.pre}</i></span>`;
  ov.innerHTML=`<div class="ov pk"><div class="pkhead"><h1>${t===0?'Blancs':'Noirs'} <span>: compose ton équipe</span></h1>
   <div class="slots">${ORDER.map(slot).join('')}</div>
   <div class="tabs">${ORDER.map((c,i)=>`<button class="tab ${c===G.ptab?'on':''}" data-c="${c}" style="--cc:${CLS[c].c}"><kbd>${i+1}</kbd> ${CLS[c].n}</button>`).join('')}<span class="grow"></span>
   <button class="btn" id="pRand"><kbd>R</kbd>Au hasard</button><button class="btn" id="pOk" ${mine.length===4?'':'disabled'}><kbd>C</kbd>Valider l'équipe</button></div></div>
   <div class="pgrid">${list.map((d,i)=>{const o=takenBy(d);return`<div class="pc ${i===G.pidx?'cur':''} ${mine.includes(d)?'mine':''} ${o>=0&&o!==t?'gone':''}" data-i="${i}" style="--cc:${CLS[d.cls].c}"><b>${d.name}</b><small>${d.sub} · #${String(d.num).padStart(3,'0')}</small>${st(d)}${o>=0&&o!==t?'<em>Pris</em>':''}</div>`}).join('')}</div>
   <div class="pinfo" style="--cc:${CLS[cur.cls].c}"><h3>${cur.name} <span class="chip">${CLS[cur.cls].n} · ${cur.sub}</span> <span class="stars">${'★'.repeat(cur.stars)}</span></h3>
   <div class="stats"><span>ATK <b>${cur.atk}</b></span><span>DEF <b>${cur.def}</b></span><span>HAB <b>${cur.hab}</b></span><span>PRE <b>${cur.pre}</b></span></div>
   <div class="abil"><b>${cur.ab.n}</b> — ${cur.ab.x}<br><b>Ultime · ${cur.ul.n}</b> — ${cur.ul.x}${G.variant?`<br><b>${cur.sub}</b> — ${SUBTXT[cur.sub]}`:''}</div></div>
   <div class="ovbar"><span><kbd>←↑↓→</kbd> naviguer</span><span><kbd>Tab</kbd>/<kbd>1-4</kbd> classe</span><span><kbd>Entrée</kbd> choisir</span><span><kbd>Retour</kbd> retirer</span></div></div>`;
  const g=ov.querySelector('.pgrid');g.scrollTop=prevScroll;const c=g.children[G.pidx];if(c)c.scrollIntoView({block:'nearest'});
  ov.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{G.ptab=b.dataset.c;G.pidx=0;showPick()});
  g.querySelectorAll('.pc').forEach(el=>{el.onclick=()=>{G.pidx=+el.dataset.i;pickHere()};});
  $('#pRand').onclick=pickRandom;$('#pOk').onclick=pickConfirm}
function pickHere(){const t=G.pickTeam,d=poolOf(G.ptab)[G.pidx],o=takenBy(d);
  if(o>=0&&o!==t){toast('Déjà pris par l\'autre camp');return showPick()}
  G.picks[t]=G.picks[t].filter(x=>x.cls!==d.cls);G.picks[t].push(d);
  const nx=ORDER.find(c=>!G.picks[t].some(x=>x.cls===c));if(nx){G.ptab=nx;G.pidx=0}showPick()}
function pickRandom(){const t=G.pickTeam;for(const c of ORDER){if(G.picks[t].some(x=>x.cls===c))continue;const av=poolOf(c).filter(d=>takenBy(d)<0);G.picks[t].push(av[Math.floor(Math.random()*av.length)])}showPick()}
function pickConfirm(){const t=G.pickTeam;if(G.picks[t].length<4){toast('Il faut un personnage par classe');return}
  G.picks[t].sort((a,b)=>ORDER.indexOf(a.cls)-ORDER.indexOf(b.cls));
  if(t===0){G.pickTeam=1;G.ptab='A';G.pidx=0;if(G.bot){pickRandom();pickConfirm();return}showPick()}
  else{$('#overlay').className='';startPlacement()}}
function pickKey(k,e){const list=poolOf(G.ptab),cols=Math.max(1,getComputedStyle(document.querySelector('.pgrid')).gridTemplateColumns.split(' ').length);
  if(k==='arrowleft'||k==='a')G.pidx--;else if(k==='arrowright'||k==='d')G.pidx++;else if(k==='arrowup'||k==='w')G.pidx-=cols;else if(k==='arrowdown'||k==='s')G.pidx+=cols;
  else if(k==='tab'){const i=ORDER.indexOf(G.ptab);G.ptab=ORDER[(i+(e.shiftKey?3:1))%4];G.pidx=0}
  else if('1234'.includes(k)&&k.length===1){G.ptab=ORDER[+k-1];G.pidx=0}
  else if(k==='enter'||k===' '){pickHere();return}
  else if(k==='backspace'||k==='delete'){G.picks[G.pickTeam]=G.picks[G.pickTeam].filter(x=>x.cls!==G.ptab)}
  else if(k==='r'){pickRandom();return}else if(k==='c'){pickConfirm();return}else return;
  showPick()}
function startPlacement(){G.phase='place';G.pl=0;const t=0;G.cur={c:SPAWN[t][0][0],r:SPAWN[t][0][1]};recalc();refresh();log('Placement : choisis la case de départ de chaque personnage')}
function placeHere(c,r){if(G.hl.get(KEY(c,r))!=='place'){toast('Choisis une case jaune');return}
  const t=G.pl%2,d=G.picks[t][Math.floor(G.pl/2)];spawnUnit(d,t,c,r);G.pl++;
  if(G.bot&&G.pl%2===1&&G.pl<8){const fr=shuffle(SPAWN[1].filter(([a,b])=>!unitAt(a,b)))[0];G.hl.set(KEY(fr[0],fr[1]),'place');placeHere(fr[0],fr[1]);return}
  if(G.pl>=8){G.phase='play';spinWheel(true);log('Roue initiale : premier jeton renfort placé au centre');beginRound();recalc();return}
  const nt=G.pl%2;G.cur={c:SPAWN[nt][0][0],r:SPAWN[nt][0][1]};recalc();refresh()}
function autoPlace(){while(G.phase==='place'){const t=G.pl%2,free=SPAWN[t].find(([c,r])=>!unitAt(c,r));G.hl.set(KEY(free[0],free[1]),'place');placeHere(free[0],free[1])}}
function showOver(){const ov=$('#overlay');ov.className='on';
  ov.innerHTML=`<div class="ov"><div class="big">Victoire des <span style="color:var(--amber)">${TEAMS[G.over]}</span></div><p style="text-align:center">Tous les personnages adverses sont éliminés.</p><p style="text-align:center"><kbd>Entrée</kbd> pour rejouer</p></div>`}


/* ============ BOT (niveau facile) ============ */
const pickR=a=>a[Math.floor(Math.random()*a.length)];
async function botTurn(){
  if(G.botRun)return;G.botRun=true;
  try{
    await sleep(700);if(G.phase!=='play'||G.turnPlayer!==1||G.mode!=='idle')return;
    const list=alive(1).filter(x=>!x.played);if(!list.length)return;
    const u=pickR(list);G.cur={c:u.c,r:u.r};refresh();await sleep(450);
    selectUnit(u);await sleep(500);
    if(G.mode==='frozen'){log(`${u.d.name} (bot) reste gelé`);await endTurn();return}
    for(let i=0;i<5&&G.sel===u&&G.phase==='play';i++){if(!await botAct(u))break;await sleep(400)}
    if(G.sel===u&&G.phase==='play')await endTurn();
  }finally{G.botRun=false}}
async function botAct(u){
  if(can('card')[0]&&Math.random()<.25){await useCard(Math.floor(Math.random()*G.hand[1].length));return true}
  if(can('atk')[0]&&Math.random()<.75){const ts=attackTargets(u),x=Math.random()<.4?ts.slice().sort((a,b)=>a.t.hp-b.t.hp)[0]:pickR(ts);await doAttack(x.t,x.solo);return true}
  if(can('ult')[0]&&Math.random()<.15&&await botAbility(u,true))return true;
  if(can('abl')[0]&&Math.random()<.35&&await botAbility(u,false))return true;
  if(can('move')[0]){
    const reach=[...reachable(u).values()].filter(n=>n.c!==u.c||n.r!==u.r),foe=alive(0).sort((a,b)=>cheb(u,a)-cheb(u,b))[0];
    if(!reach.length||!foe)return false;
    const dest=Math.random()<.3?pickR(reach):reach.slice().sort((a,b)=>cheb(a,foe)-cheb(b,foe)||Math.random()-.5)[0];
    await doMove({c:dest.c,r:dest.r});return true}
  return false}
async function botAbility(u,isUlt){
  const s=isUlt?u.d.ul:u.d.ab,ts=targetsFor(u,s);if(!ts.length)return false;
  let tg;
  if(s.t==='enemy')tg=pickR(ts);
  else if(s.t==='ally'){const w=ts.slice().sort((a,b)=>a.hp-b.hp)[0];if(w.hp>=4&&!w.effect&&Math.random()<.7)return false;tg=w}
  else if(s.t==='cell'){const foe=alive(0).sort((a,b)=>cheb(u,a)-cheb(u,b))[0];tg=Math.random()<.3?pickR(ts):ts.slice().sort((a,b)=>cheb(a,foe)-cheb(b,foe))[0]}
  else tg=ts;
  await doAbility(isUlt,tg);return true}

/* ============ ENTRÉES ============ */
async function command(cmd){
  if(G.bot&&G.turnPlayer===1)return;
  if(G.busy||G.phase!=='play'||!G.sel)return;const u=G.sel;
  if(cmd==='end'){if(G.mode==='frozen'){log(`${u.d.name} reste gelé et passe son tour`)}await endTurn();return}
  if(cmd==='thaw'){if(G.mode!=='frozen')return;G.busy=true;u.effect=null;log(`${u.d.name} brise la glace`);await dmg(u,1,null);G.busy=false;if(u.alive){G.mode='sel';recalc();refresh()}else{await endTurn()}return}
  if(G.mode==='frozen')return;
  if(G.mode===cmd){G.mode='sel';recalc();refresh();return}
  const[ok,why]=can(cmd);if(!ok){toast(why);return}
  if(cmd==='card'){G.mode='card';G.cardIdx=0;refresh();return}
  G.mode=cmd;recalc();
  if(cmd==='move'){const p=[...G.hl.keys()][0];if(p){const[c,r]=p.split(',').map(Number);G.cur={c,r}}}
  else{const k=[...G.hl.keys()][0];if(k){const[c,r]=k.split(',').map(Number);G.cur={c,r}}}
  refresh()}
async function confirmAct(){
  if(G.busy)return;if(G.phase==='play'&&G.bot&&G.turnPlayer===1)return;const{c,r}=G.cur;
  if(G.phase==='place')return placeHere(c,r);
  if(G.phase!=='play')return;
  if(G.mode==='idle'){const u=unitAt(c,r);if(u&&u.team===G.turnPlayer&&!u.played)selectUnit(u);else toast(u&&u.played?'Ce personnage a déjà joué cette manche':`Choisis un personnage des ${TEAMS[G.turnPlayer]}`);return}
  const u=G.sel,k=KEY(c,r),h=G.hl.get(k),t=unitAt(c,r);
  if(G.mode==='card'){useCard(G.cardIdx);return}
  if(G.mode==='sel'){if(t&&t!==u&&t.team===u.team&&!t.played&&!G.committed)selectUnit(t);else toast('Choisis une action (1-5)');return}
  if(G.mode==='move'){if(h==='move')return doMove({c,r})}
  else if(G.mode==='atk'){if(t&&h==='atk')return doAttack(t,G.solo.has(k))}
  else if(G.mode==='abl'||G.mode==='ult'){const isU=G.mode==='ult',s=isU?u.d.ul:u.d.ab;
    if(s.t==='none')return doAbility(isU,targetsFor(u,s));
    if(s.t==='cell'){if(h)return doAbility(isU,{c,r})}else if(t&&h)return doAbility(isU,t)}
  toast('Cible ou case invalide')}
const MOVE={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],z:[0,-1],q:[-1,0]};
function cancel(){if(G.busy||G.phase!=='play'||(G.bot&&G.turnPlayer===1))return;if(G.mode==='sel'&&!G.committed&&G.sel){G.sel=null;G.mode='idle';recalc();refresh()}else if(['move','atk','abl','ult','card'].includes(G.mode)){G.mode='sel';recalc();refresh()}}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
  if(G.phase==='menu'){
    if(k==='arrowleft'||k==='arrowright'||k==='a'||k==='d'||k==='arrowup'||k==='arrowdown'){G.menuSel=1-G.menuSel;showMenu()}
    else if(k==='1'||k==='2'){G.menuSel=+k-1;menuGo()}
    else if(k==='enter'||k===' ')menuGo();
    else if(k==='b'){G.variant=!G.variant;showMenu()}
    return}
  if(G.phase==='pick'){pickKey(k,e);return}
  if(G.phase==='over'){if(k==='enter'){$('#overlay').className='';startMenu()}return}
  if(k==='v'){camMode=1-camMode;return}
  if(k==='+'||k==='='){zoomMul=Math.max(.6,zoomMul-.1);resize();return}
  if(k==='-'||k==='_'){zoomMul=Math.min(1.6,zoomMul+.1);resize();return}
  if(k==='h'){$('#keys').classList.toggle('min');return}
  if(G.phase==='place'&&k==='x'){autoPlace();return}
  if(G.busy)return;
  if(G.phase==='play'&&G.bot&&G.turnPlayer===1&&!MOVE[k])return;
  if(G.mode==='card'){
    if(k==='arrowup'||k==='w'){G.cardIdx=(G.cardIdx+G.hand[G.sel.team].length-1)%G.hand[G.sel.team].length;refresh();return}
    if(k==='arrowdown'||k==='s'){G.cardIdx=(G.cardIdx+1)%G.hand[G.sel.team].length;refresh();return}
  }
  if(MOVE[k]&&G.mode!=='card'){const[dc,dr]=MOVE[k];G.cur={c:Math.max(0,Math.min(N-1,G.cur.c+dc)),r:Math.max(0,Math.min(N-1,G.cur.r+dr))};refresh();return}
  if(k==='enter'||k===' '){confirmAct();return}
  if(k==='escape'||k==='backspace'){cancel();return}
  if(G.phase!=='play')return;
  if(k==='tab'){const list=alive(G.turnPlayer).filter(u=>!u.played);if(!list.length)return;
    if(G.sel&&G.committed){toast('Termine d\'abord le tour de '+G.sel.d.name);return}
    const cur=list.findIndex(u=>u.c===G.cur.c&&u.r===G.cur.r),n=list[(cur+1)%list.length];G.cur={c:n.c,r:n.r};
    if(G.sel)selectUnit(n);else refresh();return}
  const cmd={'1':'move','2':'atk','3':'abl','4':'ult','5':'card',e:'end',f:'thaw'}[k];if(cmd)command(cmd)});

// souris
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();
function pick(ev){const r=canvas.getBoundingClientRect();mp.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(tiles)[0];return h&&h.object.userData}
canvas.addEventListener('pointermove',ev=>{if(G.phase==='menu'||G.phase==='pick'||G.busy)return;const p=pick(ev);if(p&&(p.c!==G.cur.c||p.r!==G.cur.r)){G.cur={c:p.c,r:p.r};renderDock()}});
canvas.addEventListener('click',ev=>{if(G.phase==='menu'||G.phase==='pick')return;const p=pick(ev);if(p){G.cur={c:p.c,r:p.r};confirmAct()}});
canvas.addEventListener('contextmenu',ev=>{ev.preventDefault();cancel()});

/* ============ BOUCLE ============ */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  stepTweens(dt);
  camNow.lerp(CAMPOS[camMode],1-Math.exp(-dt*5));cam.position.copy(camNow);cam.lookAt(0,0,camMode?0.9:1.5);cam.updateMatrixWorld();
  const cp=cellPos(G.cur.c,G.cur.r,0.05+Math.sin(t*5)*.03);cursor.position.copy(cp);cursor.visible=G.phase!=='menu'&&G.phase!=='pick'&&G.phase!=='over';
  cursor.material.color.setHex(G.busy?0x777777:0xffb42e);
  if(G.sel&&G.sel.alive){selRing.visible=true;selRing.position.copy(G.sel.mesh.position);selRing.position.y+=0.16;selRing.rotation.y=t}else selRing.visible=false;
  tk.rotation.y=t*2;tk.position.y=0.55+Math.sin(t*3)*.07;tkr.rotation.z=t;
  for(const u of G.units){if(!u.alive)continue;const b=u.mesh.userData.body;b.position.y=Math.sin(t*2+u.id)*.03;if(u.mesh.userData.ring)u.mesh.userData.ring.rotation.z=t*1.5;
    const dim=u.played?.45:1;for(const m of u.mesh.userData.mats)m.color.copy(m.userData.col).multiplyScalar(dim)}
  if(G.phase==='play'&&G.bot&&G.turnPlayer===1&&G.mode==='idle'&&!G.busy&&!G.botRun)botTurn();
  paintHL();renderer.render(scene,cam);renderBadges();requestAnimationFrame(frame)}

resize();renderKeys();startMenu();requestAnimationFrame(frame);
</script>
